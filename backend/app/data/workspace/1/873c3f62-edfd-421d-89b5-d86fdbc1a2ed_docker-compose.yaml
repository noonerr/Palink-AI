services:
  server:
    container_name: xiaozhugame_server
    image: xiaozhu674/gameservermanager:latest
    user: 0:0
    privileged: true
    network_mode: host
    volumes:
      - ./game_data:/home/steam/games  # 游戏数据，目录权限777
      - ./game_file:/home/steam/.config # 通用游戏存档路径1。目录权限777
      - ./game_file:/home/steam/.local  # 通用游戏存档路径2。目录权限777
      # 【可选】容器额外运行库安装路径 请将权限设置为777
      # - ./game_environment:/home/steam/environment
      # 【可选】容器内网穿透frpc配置文件
      # - ./game_frpc/frpc/frpc.toml:/home/steam/FRP/frpc/frpc.toml
      # 【可选】定时备份路径
      # - ./game_backup:/home/steam/backup
    environment:
      - TZ=Asia/Shanghai
      - USE_GUNICORN=true
      - GUNICORN_TIMEOUT=120
      - GUNICORN_PORT=5000
    command: /home/steam/start_web.sh
    stdin_open: true
    tty: true