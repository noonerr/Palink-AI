limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 8080 http2;
    server_tokens off;
    charset utf-8;
    absolute_redirect off;

    gzip on;
    gzip_types text/plain application/javascript text/css application/json application/wasm image/svg+xml font/woff2 application/xml text/javascript;
    # Brotli 压缩：当前 DISABLED —— 需在 Dockerfile 安装 nginx-mod-http-brotli 并
    # load_module 加载后才能启用。注意：2026-08-17 实测 apk 包与 nginx:alpine
    # 1.28.3-r7 版本冲突（breaks: nginx=1.28.3-r7），镜像构建失败，见
    # frontend/Dockerfile 对应注释。恢复方式：解决模块版本匹配后取消下面 4 行注释。
    # brotli on;
    # brotli_comp_level 6;
    # brotli_types text/plain application/javascript text/css application/json application/wasm image/svg+xml font/woff2 application/xml text/javascript;
    # brotli_min_length 256;
    client_max_body_size 100m;

    limit_conn conn_limit 50;

    if ($uri ~* \.\.) {
        return 403;
    }

    # ST 原装静态资源：固定资源（图片/字体/音效/背景/主题）用 immutable 长缓存，
    # 其余（HTML 入口/JS/CSS）用协商缓存 no-cache（304 校验），保证 ST 升级后拿到最新内容。
    # 用并列 ^~ 前缀 location + nginx「最长前缀匹配」区分，避免每次 iframe 加载重复下载
    # 3.8MB script.js + 509KB lib.js + 字体图片。
    location ^~ /st/img/ {
        root /usr/share/nginx/html;
        try_files $uri =404;
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location ^~ /st/sounds/ {
        root /usr/share/nginx/html;
        try_files $uri =404;
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location ^~ /st/backgrounds/ {
        root /usr/share/nginx/html;
        try_files $uri =404;
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location ^~ /st/themes/ {
        root /usr/share/nginx/html;
        try_files $uri =404;
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location ^~ /st/webfonts/ {
        root /usr/share/nginx/html;
        try_files $uri =404;
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location ^~ /st/ {
        root /usr/share/nginx/html;
        try_files $uri =404;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "0" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # CSP 面向直连模式（智能卡第三方资源默认浏览器直连，见 asset-mode.ts）：
        # - font/style/media/img 放开 https:/http:（原 'self' 会拦掉直连图床/字体/CDN 样式，
        #   此前仅代理模式因同源 URL 而通过）
        # - script-src CDN 列表与插件 fetch 白名单（sandbox DEFAULT_CDN_WHITELIST）对齐，
        #   另保留 drive.baibai.cv（运行中容器历史配置已有）；缺 CDN 域名会导致卡片
        #   依赖库加载失败 → "Cannot set properties of undefined (setting 'XXX')"
        # - connect-src 放开 http:（http 部署下 no-cors 预热）
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob: https://cdnjs.cloudflare.com https://cdn.jsdelivr.net https://unpkg.com https://raw.githubusercontent.com https://github.com https://drive.baibai.cv; style-src 'self' 'unsafe-inline' https: http:; img-src 'self' data: blob: https: http:; font-src 'self' data: blob: https:; connect-src 'self' https: wss: ws: http:; media-src 'self' blob: data: https: http:; worker-src 'self' blob:; frame-src 'self' http://localhost:8000 http://127.0.0.1:8000 http://localhost:8001 http://127.0.0.1:8001; base-uri 'self'; form-action 'self';" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Cache-Control "no-cache, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # 兼容 ST 原版不以 /st/ 为前缀的静态资源引用（root 指向 html/st）
    location ^~ /locales/ { root /usr/share/nginx/html/st; try_files $uri =404; include /etc/nginx/security-headers.conf; add_header Cache-Control "no-cache, must-revalidate"; }
    location ^~ /scripts/ { root /usr/share/nginx/html/st; try_files $uri =404; include /etc/nginx/security-headers.conf; add_header Cache-Control "no-cache, must-revalidate"; }
    location ^~ /lib/ { root /usr/share/nginx/html/st; try_files $uri =404; include /etc/nginx/security-headers.conf; add_header Cache-Control "no-cache, must-revalidate"; }
    location ^~ /css/ { root /usr/share/nginx/html/st; try_files $uri =404; include /etc/nginx/security-headers.conf; add_header Cache-Control "no-cache, must-revalidate"; }
    location ^~ /templates/ { root /usr/share/nginx/html/st; try_files $uri =404; include /etc/nginx/security-headers.conf; add_header Cache-Control "no-cache, must-revalidate"; }
    location ^~ /user/ { root /usr/share/nginx/html/st; try_files $uri =404; include /etc/nginx/security-headers.conf; add_header Cache-Control "no-cache, must-revalidate"; }
    location ^~ /worlds/ { root /usr/share/nginx/html/st; try_files $uri =404; include /etc/nginx/security-headers.conf; add_header Cache-Control "no-cache, must-revalidate"; }
    location ^~ /movingUI/ { root /usr/share/nginx/html/st; try_files $uri =404; include /etc/nginx/security-headers.conf; add_header Cache-Control "no-cache, must-revalidate"; }
    location ^~ /quick-replies/ { root /usr/share/nginx/html/st; try_files $uri =404; include /etc/nginx/security-headers.conf; add_header Cache-Control "no-cache, must-revalidate"; }
    # 无 /st/ 前缀的图片/字体固定资源（root 指向 html/st）
    location ^~ /img/ { root /usr/share/nginx/html/st; try_files $uri =404; include /etc/nginx/security-headers.conf; add_header Cache-Control "public, max-age=31536000, immutable"; }
    location ^~ /sounds/ { root /usr/share/nginx/html/st; try_files $uri =404; include /etc/nginx/security-headers.conf; add_header Cache-Control "public, max-age=31536000, immutable"; }
    location ^~ /backgrounds/ { root /usr/share/nginx/html/st; try_files $uri =404; include /etc/nginx/security-headers.conf; add_header Cache-Control "public, max-age=31536000, immutable"; }
    location ^~ /themes/ { root /usr/share/nginx/html/st; try_files $uri =404; include /etc/nginx/security-headers.conf; add_header Cache-Control "public, max-age=31536000, immutable"; }
    location ^~ /webfonts/ { root /usr/share/nginx/html/st; try_files $uri =404; include /etc/nginx/security-headers.conf; add_header Cache-Control "public, max-age=31536000, immutable"; }

    location = /manifest.json {
        alias /usr/share/nginx/html/manifest.json;
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location = /sw.js {
        alias /usr/share/nginx/html/sw.js;
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Vite 构建产物：文件名格式是 name-HASH.js/css（hash 前是连字符，不是点号！）。
    # hash 字符集为 [a-zA-Z0-9_-]。必须用 -[a-zA-Z0-9_-]+\.(js|css)$ 匹配，
    # 否则主 bundle（~1.97MB）落不到 immutable，每次刷新全量重下。
    location ~* -[a-zA-Z0-9_-]+\.(js|css)$ {
        root /usr/share/nginx/html;
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    location /icons/ {
        alias /usr/share/nginx/html/icons/;
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, immutable";
        expires 30d;
    }

    location ~ ^/api/(token|register) {
        include /etc/nginx/security-headers.conf;
        limit_req zone=auth_limit burst=10 nodelay;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        include /etc/nginx/security-headers.conf;
        proxy_pass http://backend:8000/uploads/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /api/smart-card-assets {
        include /etc/nginx/security-headers.conf;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_http_version 1.1;
        proxy_buffering on;
        proxy_read_timeout 120s;
        proxy_connect_timeout 120s;
        proxy_send_timeout 120s;
    }

    location /api/ {
        include /etc/nginx/security-headers.conf;
        limit_req zone=api_limit burst=30 nodelay;
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 600s;
        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
    }

    # 状态栏卡片在 sandbox(opaque-origin) iframe 内渲染，请求不带 cookie，
    # 无法走 auth_request。头像走后端已有的 /api/st/characters/{key} 路由
    # （后端对该路由不强制鉴权），由上方 location /api/ 代理转发。
    # 注意：/characters/* 是前端 SPA 角色详情路由，不能被代理，否则刷新角色
    # 详情页会返回头像图片、访问 /characters/ 也报 "Character not found"。
    # 头像 URL 在前端构造时统一使用 /api/st/characters/ 前缀。
}

server {
    listen 8081;
    server_tokens off;
    charset utf-8;
    absolute_redirect off;

    client_max_body_size 100m;
    error_page 401 = @st_native_unauthorized;

    location @st_native_unauthorized {
        return 401;
    }

    location = /__palink_st_native_auth {
        internal;
        proxy_pass http://backend:8000/api/st/native/auth;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $host;
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Cookie $http_cookie;
    }

    location = /__palink_st_native_login {
        proxy_pass http://backend:8000/api/st/native/login;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    location = /palink-silly-tavern-loader.js {
        auth_request /__palink_st_native_auth;
        auth_request_set $palink_st_cookie $upstream_http_set_cookie;
        add_header Set-Cookie $palink_st_cookie always;
        alias /usr/share/nginx/html/palink-silly-tavern-loader.js;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location = /palink-smart-card.js {
        auth_request /__palink_st_native_auth;
        auth_request_set $palink_st_cookie $upstream_http_set_cookie;
        add_header Set-Cookie $palink_st_cookie always;
        alias /usr/share/nginx/html/palink-smart-card.js;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location = /palink-silly-tavern-theme.css {
        auth_request /__palink_st_native_auth;
        auth_request_set $palink_st_cookie $upstream_http_set_cookie;
        add_header Set-Cookie $palink_st_cookie always;
        alias /usr/share/nginx/html/palink-silly-tavern-theme.css;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location ~ ^/(version|csrf-token|thumbnail|characters/[^/]+\.(png|jpg|jpeg|gif|webp|svg)|api/(settings|characters|chats|worldinfo|backends/chat-completions|tokenizers|st/thumbnail|st/characters)(/|$)) {
        auth_request /__palink_st_native_auth;
        auth_request_set $palink_st_cookie $upstream_http_set_cookie;
        auth_request_set $palink_st_character_id $upstream_http_x_palink_character_id;
        auth_request_set $palink_st_session_id $upstream_http_x_palink_session_id;
        auth_request_set $palink_st_branch_id $upstream_http_x_palink_branch_id;
        auth_request_set $palink_st_model $upstream_http_x_palink_model;
        add_header Set-Cookie $palink_st_cookie always;
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Palink-ST-Session $cookie_palink_st_native;
        proxy_set_header X-Palink-Character-Id $palink_st_character_id;
        proxy_set_header X-Palink-Session-Id $palink_st_session_id;
        proxy_set_header X-Palink-Branch-Id $palink_st_branch_id;
        proxy_set_header X-Palink-Model $palink_st_model;
        proxy_read_timeout 600s;
        proxy_connect_timeout 120s;
        proxy_send_timeout 600s;
        proxy_buffering off;
        proxy_cache off;
    }

    location / {
        auth_request /__palink_st_native_auth;
        auth_request_set $palink_st_cookie $upstream_http_set_cookie;
        auth_request_set $palink_st_user_id $upstream_http_x_palink_user_id;
        # N-6: 与 X-Palink-User-Id 配套的 HMAC 签名头（openai_compat 校验用）
        auth_request_set $palink_st_user_sig $upstream_http_x_palink_user_sig;
        auth_request_set $palink_st_username $upstream_http_x_palink_username;
        auth_request_set $palink_st_is_admin $upstream_http_x_palink_is_admin;
        auth_request_set $palink_st_character_id $upstream_http_x_palink_character_id;
        auth_request_set $palink_st_session_id $upstream_http_x_palink_session_id;
        auth_request_set $palink_st_branch_id $upstream_http_x_palink_branch_id;
        auth_request_set $palink_st_model $upstream_http_x_palink_model;
        add_header Set-Cookie $palink_st_cookie always;
        proxy_pass http://sillytavern:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Palink-User-Id $palink_st_user_id;
        proxy_set_header X-Palink-User-Sig $palink_st_user_sig;
        proxy_set_header X-Palink-Username $palink_st_username;
        proxy_set_header X-Palink-Is-Admin $palink_st_is_admin;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 600s;
        proxy_connect_timeout 120s;
        proxy_send_timeout 600s;
        proxy_buffering off;
        proxy_cache off;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy;
        proxy_set_header Accept-Encoding "";
        sub_filter_once on;
        sub_filter_types text/html;
        sub_filter '</head>' '<script src="/palink-silly-tavern-loader.js"></script></head>';
    }
}
