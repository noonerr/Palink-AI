limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

# [性能 2026-09-21 N4] 头像/共享媒体代理缓存。
# 路径必须位于 /var/cache/nginx 之下：Dockerfile 已把该目录 chown 给 appuser(uid 1000)，
# 换到其他路径会因权限写不进缓存。
proxy_cache_path /var/cache/nginx/media levels=1:2 keys_zone=media_cache:10m
                 max_size=256m inactive=7d use_temp_path=off;

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    # 原 `listen 8080 http2` 是 nginx 1.25.1 起废弃的写法（nginx -t 每次告警一条），改独立指令。
    listen 8080;
    http2 on;
    server_tokens off;
    charset utf-8;
    absolute_redirect off;

    gzip on;
    # [性能 2026-09-21 N5] 优先投递构建期预压好的 .gz（gzip_static），省掉实时压缩 CPU。
    # 没有 .gz 时自动回退实时压缩，不会 404。已确认镜像带 --with-http_gzip_static_module。
    gzip_static on;
    # 同一 URI 有压缩/未压缩两种响应，缺 Vary 会让中间缓存串味
    gzip_vary on;
    # 去掉 font/woff2：woff2 本身已是压缩格式，再 gzip 只浪费 CPU
    gzip_types text/plain application/javascript text/css application/json application/wasm image/svg+xml application/xml text/javascript;
    # [性能 2026-09-22] gzip_proxied 默认 off = 转发到后端的响应一律不压，实测所有 API
    # JSON 此前裸传（带 Accept-Encoding: gzip 请求 /api/auth/config 仍返回未压缩）。
    # 打开后只压上面 gzip_types 列出的类型：SSE 的 text/event-stream 与 JSONL 的
    # application/jsonl 都不在表内，流式响应不会被压缩、也不会被压进缓冲区。
    gzip_proxied any;
    # Brotli 压缩：当前 DISABLED —— 需在 Dockerfile 安装 nginx-mod-http-brotli 并
    # load_module 加载后才能启用。注意：2026-08-17 实测 apk 包与 nginx:alpine
    # 1.28.3-r7 版本冲突（breaks: nginx=1.28.3-r7），镜像构建失败，见
    # frontend/Dockerfile 对应注释。恢复方式：解决模块版本匹配后取消下面 4 行注释。
    # brotli on;
    # brotli_comp_level 6;
    # brotli_types text/plain application/javascript text/css application/json application/wasm image/svg+xml font/woff2 application/xml text/javascript;
    # brotli_min_length 256;
    client_max_body_size 100m;

    limit_conn conn_limit 50;

    if ($uri ~* \.\.) {
        return 403;
    }

    location = /manifest.json {
        alias /usr/share/nginx/html/manifest.json;
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location = /sw.js {
        alias /usr/share/nginx/html/sw.js;
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Vite 构建产物：文件名格式是 name-HASH.js/css（hash 前是连字符，不是点号！）。
    # 使用 no-cache 协商缓存，确保浏览器每次请求都向服务器验证文件是否更新。
    # 虽然 Vite 用内容 hash 做文件名，但 iOS Safari 内存缓存可能无视 index.html 的
    # no-cache 头，导致旧 HTML 引用旧 JS/CSS；而旧 JS/CSS 若被 immutable 永久缓存，
    # 用户永远跑旧代码。改为 no-cache 后，即使旧 HTML 被缓存，旧 JS/CSS 也会被
    # 重新验证（304 回退），且新 HTML 引用新文件名时自然走新文件。
    # [性能 2026-09-21 N1] 文件名自带内容指纹：内容变则名字变，不存在拿旧内容的可能，
    # 故可安全长缓存。原文案所用 no-cache 会让这 88 个文件每次开页面都跑一次 304 往返。
    # 设计意图佐证：vite-plugins/smart-card-runtime-asset.ts 的 dev 中间件对 hash 资产
    # 发的就是 public, max-age=31536000, immutable（注释亦写明"命中 nginx immutable 缓存规则"）。
    # 前提：index.html 必须保持 no-store（见下方 location /），否则旧 HTML 会引用已删除的旧 hash。
    location ~* -[a-zA-Z0-9_-]+\.(js|css)$ {
        root /usr/share/nginx/html;
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # [性能 2026-09-21 N2] 非 hash 静态资源：原本全部落到 location / 吃 no-store，
    # 每次全量重下。逐一给 max-age。
    # /st/ 是 public/st 下的手工维护第三方资源（ST 插件依赖的 Font Awesome），
    # 无内容指纹，故用 7d 而非 30d，避免上游更新后长期拿旧版。
    location = /bootstrap.js {
        root /usr/share/nginx/html;
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=604800";
    }

    location = /katex.min.css {
        root /usr/share/nginx/html;
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=2592000";
    }

    location ^~ /fonts/ {
        root /usr/share/nginx/html;
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=2592000";
    }

    location ^~ /st/ {
        root /usr/share/nginx/html;
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=604800";
    }

    # [性能 2026-09-21 N3] 原先同时用 expires 与 add_header，导致输出两条 Cache-Control。
    # 去掉 expires，只保留一条。
    # 本目录图标由 manifest.json 按固定名引用（icon-192x192.png 等），文件名无内容指纹
    # → 不可标 immutable：否则换同名图后浏览器与已装 PWA 最长 30 天拿不到新图。
    location /icons/ {
        alias /usr/share/nginx/html/icons/;
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=2592000";
    }

    location ~ ^/api/(token|register) {
        include /etc/nginx/security-headers.conf;
        limit_req zone=auth_limit burst=10 nodelay;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        include /etc/nginx/security-headers.conf;
        proxy_pass http://backend:8000/uploads/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /api/smart-card-assets {
        include /etc/nginx/security-headers.conf;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_http_version 1.1;
        proxy_buffering on;
        proxy_read_timeout 120s;
        proxy_connect_timeout 120s;
        proxy_send_timeout 120s;
    }

    # [性能 2026-09-21 N4] 角色头像：后端对该路由不强制鉴权，是共享内容，可安全缓存。
    # ⛔ /uploads/ 走 N-7 短时效令牌鉴权，绝不可并入此块：
    #    - 默认缓存键含 query，token 每 5 分钟变 → 命中率≈0，做了也没收益；
    #    - 若为提命中率把 token 从缓存键剔除 → 知道路径即可拿到他人附件缓存体 = 安全回归。
    # 匹配优先级：本前缀(19 字符) 长于 /api/(5 字符)，最长前缀胜出；^~ 再确保跳过正则。
    location ^~ /api/st/characters/ {
        include /etc/nginx/security-headers.conf;
        proxy_pass http://backend:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        # /api/ 那条为了 SSE 是 off，这里必须显式打开才能进缓存
        proxy_buffering on;
        proxy_cache media_cache;
        # [性能 2026-09-22] gzip_proxied 打开后同一 URI 有压缩/未压缩两种响应体，而默认
        # 缓存键不含 Accept-Encoding → 会把先到的那种变体发给所有客户端。按编码分键隔离。
        proxy_cache_key "$scheme$proxy_host$request_uri$http_accept_encoding";
        # 只缓存成功响应，避免故障被缓存放大
        proxy_cache_valid 200 206 7d;
        proxy_cache_lock on;
        proxy_cache_use_stale error timeout updating;
        add_header X-Cache-Status $upstream_cache_status;
        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
    }

    location /api/ {
        include /etc/nginx/security-headers.conf;
        limit_req zone=api_limit burst=30 nodelay;
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 600s;
        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
    }

    # 状态栏卡片在 sandbox(opaque-origin) iframe 内渲染，请求不带 cookie，
    # 无法走 auth_request。头像走后端已有的 /api/st/characters/{key} 路由
    # （后端对该路由不强制鉴权），由上方 location /api/ 代理转发。
    # 注意：/characters/* 是前端 SPA 角色详情路由，不能被代理，否则刷新角色
    # 详情页会返回头像图片、访问 /characters/ 也报 "Character not found"。
    # 头像 URL 在前端构造时统一使用 /api/st/characters/ 前缀。
}
