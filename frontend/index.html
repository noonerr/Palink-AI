<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Palink AI</title>
    
    <link rel="manifest" href="./manifest.json" />
    <meta name="theme-color" content="#3b82f6" />
    <meta name="description" content="Palink AI - 智能对话助手" />
    <meta name="application-name" content="Palink AI" />
    
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Palink" />
    
    <link rel="apple-touch-icon" sizes="180x180" href="./icons/icon-192x192.png" />
    <link rel="apple-touch-icon" sizes="167x167" href="./icons/icon-192x192.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="./icons/icon-152x152.png" />
    <link rel="apple-touch-icon" sizes="120x120" href="./icons/icon-128x128.png" />
    
    <link rel="icon" type="image/png" sizes="16x16" href="./icons/icon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="./icons/icon-32x32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="./icons/icon-48x48.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192x192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="./icons/icon-512x512.png" />
    
    <meta name="msapplication-TileColor" content="#3b82f6" />
    <meta name="msapplication-tap-highlight" content="no" />
  </head>
  <body>
    <div id="root"></div>
    <script>
      window.onerror = function(msg, url, line, col, error) {
        console.error('Global error:', msg, url, line, col, error);
        const root = document.getElementById('root');
        if (root) {
          root.innerHTML = '<div style="padding: 20px; text-align: center; color: red;"><h1>发生错误</h1><p>' + msg + '</p><button onclick="location.reload()">刷新页面</button></div>';
        }
        return false;
      };
      window.onunhandledrejection = function(event) {
        console.error('Unhandled promise rejection:', event.reason);
        const root = document.getElementById('root');
        if (root) {
          root.innerHTML = '<div style="padding: 20px; text-align: center; color: red;"><h1>发生错误</h1><p>' + event.reason + '</p><button onclick="location.reload()">刷新页面</button></div>';
        }
      };
    </script>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Temporary stability fix: disable PWA caching and clear stale SWs.
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.getRegistrations()
            .then((registrations) => {
              registrations.forEach((registration) => registration.unregister());
            })
            .catch((error) => {
              console.log('Service Worker cleanup failed:', error);
            });

          if ('caches' in window) {
            caches.keys().then((keys) => {
              keys.forEach((key) => caches.delete(key));
            });
          }
        });
      }
    </script>
  </body>
</html>
