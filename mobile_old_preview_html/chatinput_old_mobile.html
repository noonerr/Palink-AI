<!doctype html>
<html lang="en"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ChatInput old mobile</title><link rel="stylesheet" href="styles.css" /></head>
<body><div class="wrapper"><div class="phone">
