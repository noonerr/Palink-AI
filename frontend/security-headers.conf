add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-XSS-Protection "0" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# [CARD-SCRIPT 2026-09-30] script-src 增补 https://*.jsdelivr.net：
# 生态卡自带的 MVU/工具库以 ES module 从 jsDelivr 镜像分发，大陆网络下主域
# cdn.jsdelivr.net 被阻断、实测只有 testingcf.jsdelivr.net 可用（与
# frontend/src/lib/sillytavern/formatting.ts:995 的图片代理口径一致）。
# 用户决策：允许卡片执行自带脚本并从 CDN 拉库。
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob: https://lf3-static.bytednsdoc.com https://sf16-sg.tiktokcdn.com https://cdnjs.cloudflare.com https://cdn.jsdelivr.net https://*.jsdelivr.net https://unpkg.com https://raw.githubusercontent.com https://github.com https://drive.baibai.cv; style-src 'self' 'unsafe-inline' https: http:; img-src 'self' data: blob: https: http:; font-src 'self' data: blob: https:; connect-src 'self' https: wss: ws: http:; media-src 'self' blob: data: https: http:; worker-src 'self' blob:; frame-src 'self' http://localhost:8000 http://127.0.0.1:8000 http://localhost:8001 http://127.0.0.1:8001; base-uri 'self'; form-action 'self';" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
