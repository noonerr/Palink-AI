<!doctype html>
<html lang="en"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CharacterView old mobile</title><link rel="stylesheet" href="styles.css" /></head>
<body><div class="wrapper"><div class="phone">
  <div class="header">CharacterView_old.tsx <span class="small">Character Chat</span></div>
  <div class="content">
    <div class="card"><strong>Character List</strong><p class="small">Select roleplay character and session</p></div>
    <div class="list-item"><strong>Aria</strong><p class="small">status: online | branch: main</p></div>
    <div class="list-item"><strong>Noah</strong><p class="small">status: idle | branch: alt-1</p></div>
    <div class="card"><strong>Mobile behavior</strong><p class="small">Uses mobileSidebarOpen and bottom safe area spacing.</p></div>
  </div>
  <div class="input-bar">
    <textarea placeholder="Talk to selected character"></textarea>
    <div class="toolbar"><span>branch/storyline controls</span><button class="btn">Send</button></div>
  </div>
  <nav class="bottom-nav">
    <div class="nav-item"><strong>💬</strong>Chat</div>
    <div class="nav-item"><strong>📁</strong>Workspace</div>
    <div class="nav-item active"><strong>🤖</strong>Roleplay</div>
    <div class="nav-item"><strong>⚙</strong>Settings</div>
  </nav>
</div></div></body></html>
