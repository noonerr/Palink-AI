<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>Palink AI · 设置</title>
<style>
/* ================================================
   Palink AI 移动端设置页（离线版）
   - 视觉：沿用 mobile-settings-preview 的玻璃态 + 项目 aurora 配色
   - 交互：借鉴 移动端demo 的跟手 slider、菜单按钮偏移动画
   =========================================== */

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}

:root{
  --font-sans:-apple-system,BlinkMacSystemFont,'Manrope','Segoe UI','PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif;

  /* ===== 深色主题（默认） ===== */
  --primary:#3b82f6;
  --primary-light:#60a5fa;
  --primary-glow:rgba(59,130,246,.15);

  --bg-deep:#0f0f1a;
  --bg-header:linear-gradient(180deg,rgba(15,15,26,.92) 0%,rgba(15,15,26,.65) 70%,transparent 100%);
  --bg-card:rgba(20,20,30,.85);
  --bg-drawer:rgba(20,20,30,.6);
  --bg-item:rgba(255,255,255,.04);
  --bg-item-hover:rgba(255,255,255,.07);
  --bg-seg:rgba(255,255,255,.05);
  --bg-toggle:rgba(255,255,255,.12);
  --bg-menu-btn:rgba(255,255,255,.08);
  --bg-toast:rgba(20,20,30,.9);
  --bg-avatar-badge-ring:rgba(20,20,30,.95);

  --border:rgba(255,255,255,.07);
  --border-light:rgba(255,255,255,.12);

  --text-primary:#f0f0f5;
  --text-secondary:#9ca3af;
  --text-muted:#6b7280;

  /* Profile 背景渐变 */
  --profile-grad:linear-gradient(135deg,rgba(0,194,255,.08) 0%,rgba(136,0,255,.06) 100%);
  --profile-glow:radial-gradient(circle,rgba(59,130,246,.18) 0%,transparent 70%);

  /* Aurora 三个 blob 颜色（跟随主题） */
  --blob-1:linear-gradient(135deg,#00f2ff,#00c3ff);
  --blob-2:linear-gradient(135deg,#4400ff,#8800ff);
  --blob-3:linear-gradient(135deg,#00ff88,#00f2ff);
  --blob-opacity:.18;
  --blob-3-opacity:.1;
  --blob-blur:60px;

  /* 图标色块（深色下较亮的 pastel） */
  --icon-blue-bg:rgba(59,130,246,.14);   --icon-blue-fg:#60a5fa;
  --icon-purple-bg:rgba(139,92,246,.14);   --icon-purple-fg:#a78bfa;
  --icon-amber-bg:rgba(245,158,11,.14);    --icon-amber-fg:#fbbf24;
  --icon-green-bg:rgba(34,197,94,.14);     --icon-green-fg:#4ade80;
  --icon-pink-bg:rgba(236,72,153,.14);     --icon-pink-fg:#f472b6;
  --icon-cyan-bg:rgba(6,182,212,.14);      --icon-cyan-fg:#22d3ee;
  --icon-red-bg:rgba(239,68,68,.14);       --icon-red-fg:#f87171;
  --icon-slate-bg:rgba(148,163,184,.12);   --icon-slate-fg:#94a3b8;

  --danger:#ef4444;
  --danger-bg:rgba(239,68,68,.08);
  --danger-border:rgba(239,68,68,.22);
  --danger-grad:linear-gradient(135deg,rgba(239,68,68,.05) 0%,rgba(239,68,68,.02) 100%);
  --success:#22c55e;
  --success-bg:rgba(34,197,94,.1);

  --shadow-slider:0 4px 14px rgba(59,130,246,.35);
  --shadow-avatar:0 8px 32px rgba(59,130,246,.28),0 0 0 3px rgba(59,130,246,.15);
  --shadow-menu-glow:0 0 14px rgba(59,130,246,.35);

  --radius:16px;
  --radius-sm:12px;
  --radius-xs:10px;

  --ease-follow:cubic-bezier(0.22,0.65,0.22,1);

  --safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
  --drawer-w:280px;
}

/* ===== 亮色主题覆盖（对齐项目 App.css 里的 light aurora 配色） ===== */
html[data-theme="light"]{
  --primary:#2563eb;
  --primary-light:#2563eb;
  --primary-glow:rgba(37,99,235,.12);

  --bg-deep:#f4f6fb;
  --bg-header:linear-gradient(180deg,rgba(244,246,251,.9) 0%,rgba(244,246,251,.6) 70%,transparent 100%);
  --bg-card:rgba(255,255,255,.75);
  --bg-drawer:rgba(255,255,255,.7);
  --bg-item:rgba(15,23,42,.03);
  --bg-item-hover:rgba(15,23,42,.06);
  --bg-seg:rgba(15,23,42,.04);
  --bg-toggle:rgba(15,23,42,.12);
  --bg-menu-btn:rgba(255,255,255,.7);
  --bg-toast:rgba(255,255,255,.92);
  --bg-avatar-badge-ring:#ffffff;

  --border:rgba(15,23,42,.06);
  --border-light:rgba(15,23,42,.1);

  --text-primary:#0f172a;
  --text-secondary:#475569;
  --text-muted:#64748b;

  --profile-grad:linear-gradient(135deg,rgba(79,172,254,.12) 0%,rgba(118,75,162,.1) 100%);
  --profile-glow:radial-gradient(circle,rgba(37,99,235,.18) 0%,transparent 70%);

  --blob-1:linear-gradient(135deg,#4facfe,#00f2fe);
  --blob-2:linear-gradient(135deg,#667eea,#764ba2);
  --blob-3:linear-gradient(135deg,#43e97b,#38f9d7);
  --blob-opacity:.28;
  --blob-3-opacity:.18;
  --blob-blur:70px;

  /* 图标色块：亮色下降低背景饱和，提高前景色对比度 */
  --icon-blue-bg:rgba(37,99,235,.1);     --icon-blue-fg:#1d4ed8;
  --icon-purple-bg:rgba(139,92,246,.1);    --icon-purple-fg:#6d28d9;
  --icon-amber-bg:rgba(245,158,11,.12);    --icon-amber-fg:#b45309;
  --icon-green-bg:rgba(34,197,94,.12);     --icon-green-fg:#15803d;
  --icon-pink-bg:rgba(236,72,153,.1);      --icon-pink-fg:#be185d;
  --icon-cyan-bg:rgba(6,182,212,.1);       --icon-cyan-fg:#0e7490;
  --icon-red-bg:rgba(239,68,68,.1);        --icon-red-fg:#b91c1c;
  --icon-slate-bg:rgba(100,116,139,.12);   --icon-slate-fg:#475569;

  --danger:#dc2626;
  --danger-bg:rgba(220,38,38,.08);
  --danger-border:rgba(220,38,38,.2);
  --danger-grad:linear-gradient(135deg,rgba(220,38,38,.04) 0%,rgba(220,38,38,.02) 100%);
  --success:#16a34a;
  --success-bg:rgba(22,163,74,.1);

  --shadow-slider:0 4px 14px rgba(37,99,235,.3);
  --shadow-avatar:0 10px 32px rgba(37,99,235,.25),0 0 0 3px rgba(37,99,235,.12);
  --shadow-menu-glow:0 0 14px rgba(37,99,235,.25);
}


html,body{
  height:100%;font-family:var(--font-sans);-webkit-font-smoothing:antialiased;
  overflow:hidden;background:var(--bg-deep);color:var(--text-primary);
  transition:background-color .35s ease,color .35s ease;
}
body{position:relative}

/* ===== Aurora Background（项目配色：青/紫/绿，色值随主题切换） ===== */
.aurora{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.aurora-blob{
  position:absolute;border-radius:50%;
  filter:blur(var(--blob-blur));opacity:var(--blob-opacity);
  will-change:transform;transform:translate3d(0,0,0);backface-visibility:hidden;
  transition:opacity .4s ease,filter .4s ease,background .4s ease;
}
.aurora-blob.b1{
  width:500px;height:500px;background:var(--blob-1);
  top:-100px;left:-100px;animation:blob-float-1 14s ease-in-out infinite alternate;
}
.aurora-blob.b2{
  width:450px;height:450px;background:var(--blob-2);
  bottom:-50px;right:-50px;animation:blob-float-2 12s ease-in-out infinite alternate;
}
.aurora-blob.b3{
  width:300px;height:300px;background:var(--blob-3);
  top:40%;left:30%;opacity:var(--blob-3-opacity);
  animation:blob-float-3 16s ease-in-out infinite alternate;
}
@keyframes blob-float-1{0%{transform:translate(0,0) rotate(0)}100%{transform:translate(30px,40px) rotate(6deg)}}
@keyframes blob-float-2{0%{transform:translate(0,0) rotate(0)}100%{transform:translate(-30px,-20px) rotate(-5deg)}}
@keyframes blob-float-3{0%{transform:translate(0,0) rotate(0)}100%{transform:translate(25px,-15px) rotate(8deg)}}
@media (prefers-reduced-motion:reduce){.aurora-blob{animation:none !important}}

/* ===== 快速导航抽屉（借自 移动端demo 的 history-side） ===== */
.drawer{
  position:fixed;top:0;left:0;width:var(--drawer-w);height:100vh;height:100dvh;
  background:var(--bg-drawer);
  backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);
  border-right:1px solid var(--border-light);
  padding:calc(var(--safe-top) + 72px) 16px calc(var(--safe-bottom) + 20px);
  color:var(--text-primary);z-index:5;
  transform:translateX(-100%);
  transition:transform .4s var(--ease-follow),background-color .35s ease,border-color .35s ease;
  overflow-y:auto;scrollbar-width:none;
}
.drawer::-webkit-scrollbar{display:none}
.drawer.open{transform:translateX(0)}
.drawer-title{
  font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;
  color:var(--text-muted);padding:0 8px;margin-bottom:12px;
}
.drawer-item{
  display:flex;align-items:center;gap:12px;
  padding:12px 14px;border-radius:var(--radius-sm);
  background:var(--bg-item);margin-bottom:6px;
  font-size:14px;color:var(--text-primary);cursor:pointer;
  transition:background .18s ease,transform .18s ease,color .18s ease,border-color .18s ease;
  border:1px solid transparent;
}
.drawer-item:active{transform:scale(.98);background:var(--bg-item-hover)}
.drawer-item.active{
  background:var(--primary-glow);
  border-color:color-mix(in srgb,var(--primary) 35%,transparent);
  color:var(--primary);
}
.drawer-dot{
  width:6px;height:6px;border-radius:50%;background:var(--text-muted);flex-shrink:0;
  transition:background .18s ease,box-shadow .18s ease;
}
.drawer-item.active .drawer-dot{
  background:var(--primary);
  box-shadow:0 0 8px var(--primary);
}

/* 菜单浮动按钮（复刻 demo 的 menu-btn + .offset 行为） */
.menu-btn{
  position:fixed;
  top:calc(var(--safe-top) + 16px);left:14px;
  z-index:20;
  width:40px;height:40px;border-radius:50%;
  background:var(--bg-menu-btn);
  backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);
  border:1px solid var(--border-light);
  display:flex;align-items:center;justify-content:center;
  color:var(--text-primary);cursor:pointer;
  transition:left .4s var(--ease-follow),background-color .35s ease,
             border-color .35s ease,box-shadow .35s ease,color .35s ease,transform .2s ease;
}
.menu-btn:active{transform:scale(.92)}
.menu-btn svg{transition:transform .4s var(--ease-follow)}
.menu-btn.offset{
  left:calc(var(--drawer-w) - 14px - 40px);
  background:color-mix(in srgb,var(--primary) 25%,var(--bg-menu-btn));
  box-shadow:var(--shadow-menu-glow);
  border-color:color-mix(in srgb,var(--primary) 45%,transparent);
  color:var(--primary);
}
.menu-btn.offset svg{transform:rotate(180deg)}

/* ===== 主容器（右推效果，借自 demo 的 .main-container.pushed） ===== */
.shell{
  position:fixed;inset:0;
  display:flex;flex-direction:column;
  background:var(--bg-deep);
  transition:transform .4s var(--ease-follow),background-color .35s ease;
  z-index:10;
}
.shell.pushed{transform:translateX(var(--drawer-w))}

/* ===== Header ===== */
.header{
  position:relative;z-index:2;flex-shrink:0;
  padding:calc(var(--safe-top) + 14px) 16px 14px;
  background:var(--bg-header);
  backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  border-bottom:1px solid var(--border);
  transition:background .35s ease,border-color .35s ease;
}
.header-inner{display:flex;align-items:center;justify-content:center;height:40px;position:relative}
.header-title{font-size:17px;font-weight:700;letter-spacing:-.01em}
.header-back{
  position:absolute;right:0;top:50%;transform:translateY(-50%);
  display:flex;align-items:center;gap:4px;background:none;border:none;
  color:var(--primary);font-size:14px;font-weight:600;cursor:pointer;
  padding:8px 4px;font-family:var(--font-sans);
}
.header-back:active{opacity:.6}

/* ===== Scrollable ===== */
.scroll-area{
  flex:1;overflow-y:auto;overflow-x:hidden;position:relative;z-index:1;
  -webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  scrollbar-width:none;padding-bottom:calc(var(--safe-bottom) + 24px);
}
.scroll-area::-webkit-scrollbar{display:none}
.content{padding:20px 14px;display:flex;flex-direction:column;gap:22px}

/* ===== Glass Cards（与项目 .glass 参数对齐：blur(20px)） ===== */
.glass{
  background:var(--bg-card);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border:1px solid var(--border);
  border-radius:var(--radius);overflow:hidden;
  transition:background .35s ease,border-color .35s ease;
}

/* ===== Profile Card ===== */
.profile-card{
  padding:24px 20px;text-align:center;position:relative;
  background:var(--profile-grad);
}
.profile-card::before{
  content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);
  width:140px;height:140px;border-radius:50%;
  background:var(--profile-glow);
  filter:blur(40px);pointer-events:none;
}
.avatar-wrap{position:relative;display:inline-flex;margin-bottom:14px}
.avatar{
  width:78px;height:78px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:34px;background:linear-gradient(135deg,var(--primary) 0%,#8b5cf6 50%,#00f2ff 100%);
  box-shadow:var(--shadow-avatar);
  position:relative;z-index:1;
}
.avatar-badge{
  position:absolute;bottom:2px;right:2px;width:22px;height:22px;border-radius:50%;
  background:var(--primary);border:3px solid var(--bg-avatar-badge-ring);
  display:flex;align-items:center;justify-content:center;z-index:2;color:#fff;
}
.profile-name{font-size:19px;font-weight:700;margin-bottom:4px;letter-spacing:-.01em}
.profile-role{
  display:inline-flex;align-items:center;gap:4px;
  font-size:11px;font-weight:600;color:var(--primary);
  padding:3px 10px;border-radius:20px;
  background:var(--primary-glow);
  border:1px solid color-mix(in srgb,var(--primary) 25%,transparent);
}

/* ===== Section ===== */
.section{display:flex;flex-direction:column;gap:8px}
.section-header{
  display:flex;align-items:center;gap:8px;padding:0 6px;
  font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;
  color:var(--text-muted);
}
.section-header svg{opacity:.6}
.section-header::after{
  content:'';flex:1;height:1px;
  background:linear-gradient(90deg,var(--border) 0%,transparent 100%);
}
/* ===== Menu Items ===== */
.menu-group{display:flex;flex-direction:column}
.menu-item{
  display:flex;align-items:center;gap:12px;padding:13px 14px;
  background:transparent;border:none;cursor:pointer;
  transition:background .18s ease,transform .18s ease;
  font-family:var(--font-sans);width:100%;
  color:var(--text-primary);font-size:15px;font-weight:500;
  position:relative;text-align:left;min-height:52px;
}
.menu-item+.menu-item,.menu-item+.toggle-item,.toggle-item+.menu-item,.toggle-item+.toggle-item,.inline-seg+.menu-item,.inline-seg+.toggle-item,.menu-item+.inline-seg,.toggle-item+.inline-seg,.inline-seg+.inline-seg{
  border-top:1px solid var(--border);
}
.menu-item:active{transform:scale(.985);background:var(--bg-item-hover)}
.menu-item:hover{background:var(--bg-item)}
.menu-icon{
  width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
  transition:background .35s ease,color .35s ease;
}
.menu-icon.blue  {background:var(--icon-blue-bg);  color:var(--icon-blue-fg)}
.menu-icon.purple{background:var(--icon-purple-bg);color:var(--icon-purple-fg)}
.menu-icon.amber {background:var(--icon-amber-bg); color:var(--icon-amber-fg)}
.menu-icon.green {background:var(--icon-green-bg); color:var(--icon-green-fg)}
.menu-icon.pink  {background:var(--icon-pink-bg);  color:var(--icon-pink-fg)}
.menu-icon.cyan  {background:var(--icon-cyan-bg);  color:var(--icon-cyan-fg)}
.menu-icon.red   {background:var(--icon-red-bg);   color:var(--icon-red-fg)}
.menu-icon.slate {background:var(--icon-slate-bg); color:var(--icon-slate-fg)}
.menu-label{flex:1;min-width:0}
.menu-label-main{font-size:15px;font-weight:500;line-height:1.3}
.menu-label-desc{font-size:12px;color:var(--text-muted);line-height:1.4;margin-top:2px}
.menu-arrow{color:var(--text-muted);flex-shrink:0;opacity:.5}
.menu-badge{
  font-size:11px;font-weight:700;padding:2px 8px;border-radius:10px;
  background:var(--success-bg);color:var(--success);flex-shrink:0;
}
.menu-meta{font-size:12px;color:var(--text-muted);flex-shrink:0}

/* ===== Toggle ===== */
.toggle-item{
  display:flex;align-items:center;gap:12px;padding:13px 14px;
  position:relative;min-height:52px;
}
.toggle-label{flex:1;min-width:0}
.toggle-label-main{font-size:15px;font-weight:500;line-height:1.3}
.toggle-label-desc{font-size:12px;color:var(--text-muted);line-height:1.4;margin-top:2px}
.toggle{
  position:relative;width:46px;height:27px;border-radius:14px;
  background:var(--bg-toggle);border:1px solid var(--border-light);
  cursor:pointer;transition:background .25s ease,border-color .25s ease;flex-shrink:0;
}
.toggle.active{background:var(--primary);border-color:var(--primary)}
.toggle::after{
  content:'';position:absolute;top:2px;left:2px;width:21px;height:21px;
  border-radius:50%;background:#fff;
  transition:transform .25s var(--ease-follow);
  box-shadow:0 2px 6px rgba(0,0,0,.25);
}
.toggle.active::after{transform:translateX(19px)}

/* ===== Segmented（升级版：带跟手滑块，借自 demo 的 dock-slider 思路） ===== */
.inline-seg{padding:14px 14px 16px}
.inline-seg-head{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.inline-seg-head .menu-icon{width:32px;height:32px;border-radius:9px}
.inline-seg-title{font-size:15px;font-weight:500;line-height:1.3}
.inline-seg-desc{font-size:12px;color:var(--text-muted);line-height:1.4;margin-top:2px}
.segmented{
  position:relative;display:flex;padding:3px;border-radius:12px;
  background:var(--bg-seg);border:1px solid var(--border);
  user-select:none;
  transition:background .35s ease,border-color .35s ease;
}
.seg-slider{
  position:absolute;top:3px;height:calc(100% - 6px);
  border-radius:10px;
  background:linear-gradient(135deg,var(--primary),#6366f1);
  box-shadow:var(--shadow-slider);
  transition:left .3s var(--ease-follow),width .3s var(--ease-follow),background .35s ease;
  z-index:0;
}
.segment{
  position:relative;z-index:1;flex:1;padding:8px 12px;border:none;cursor:pointer;
  font-family:var(--font-sans);font-size:13px;font-weight:600;
  background:transparent;color:var(--text-muted);
  transition:color .25s ease;text-align:center;
  border-radius:10px;
}
.segment.active{color:#fff}
/* ===== Danger Zone === */
.danger-card{
  border-color:var(--danger-border) !important;
  background:var(--danger-grad) !important;
  transition:background .35s ease,border-color .35s ease;
}
.danger-header{
  display:flex;align-items:center;gap:10px;padding:14px 16px;
  color:var(--danger);font-size:13px;font-weight:600;
  border-bottom:1px solid var(--danger-border);
}
.logout-btn{
  width:100%;padding:14px;border:none;cursor:pointer;
  font-family:var(--font-sans);font-size:15px;font-weight:600;
  color:var(--danger);background:transparent;
  display:flex;align-items:center;justify-content:center;gap:8px;
  transition:background .18s ease,transform .18s ease;
}
.logout-btn:active{background:var(--danger-bg);transform:scale(.985)}

/* ===== Footer ===== */
.footer{
  text-align:center;padding:8px 16px 16px;
  font-size:11px;color:var(--text-muted);opacity:.55;
  position:relative;z-index:1;
}

/* ===== Fade In Stagger ===== */
@keyframes fade-up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
.anim-in{animation:fade-up .42s ease-out both}
.anim-in:nth-child(1){animation-delay:.04s}
.anim-in:nth-child(2){animation-delay:.08s}
.anim-in:nth-child(3){animation-delay:.12s}
.anim-in:nth-child(4){animation-delay:.16s}
.anim-in:nth-child(5){animation-delay:.2s}
.anim-in:nth-child(6){animation-delay:.24s}
.anim-in:nth-child(7){animation-delay:.28s}
.anim-in:nth-child(8){animation-delay:.32s}
.anim-in:nth-child(9){animation-delay:.36s}

/* ===== Toast（保存反馈） ===== */
.toast{
  position:fixed;top:calc(var(--safe-top) + 72px);left:50%;transform:translateX(-50%) translateY(-10px);
  background:var(--bg-toast);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border:1px solid var(--border-light);
  padding:10px 16px;border-radius:12px;
  font-size:13px;color:var(--text-primary);
  box-shadow:0 10px 30px rgba(0,0,0,.18);
  display:flex;align-items:center;gap:8px;
  opacity:0;pointer-events:none;
  transition:opacity .25s ease,transform .3s var(--ease-follow),background .35s ease,color .35s ease,border-color .35s ease;
  z-index:30;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast .dot{width:6px;height:6px;border-radius:50%;background:var(--success)}
</style>

<script>
// ===== 抽屉开合（菜单按钮 + 主容器右推，借自 移动端demo） =====
const drawer = document.getElementById('drawer');
const shell = document.getElementById('shell');
const menuBtn = document.getElementById('menuBtn');
let drawerOpen = false;

function setDrawer(open){
  drawerOpen = open;
  drawer.classList.toggle('open', open);
  shell.classList.toggle('pushed', open);
  menuBtn.classList.toggle('offset', open);
  menuBtn.setAttribute('aria-label', open ? '关闭快速导航' : '打开快速导航');
}
menuBtn.addEventListener('click', e => { e.stopPropagation(); setDrawer(!drawerOpen); });

// 点击主容器任意处关闭抽屉（抽屉打开时）
shell.addEventListener('click', e => {
  if(!drawerOpen) return;
  if(!e.target.closest('.menu-btn')) setDrawer(false);
});

// ===== 抽屉跳转：点击锚点后滚动定位 =====
const scrollArea = document.getElementById('scrollArea');
drawer.querySelectorAll('.drawer-item').forEach(item => {
  item.addEventListener('click', () => {
    drawer.querySelectorAll('.drawer-item').forEach(i => i.classList.remove('active'));
    item.classList.add('active');
    const id = item.dataset.anchor;
    const target = document.getElementById(id);
    if(target){
      const y = target.offsetTop - 12;
      scrollArea.scrollTo({ top: y, behavior: 'smooth' });
    }
    setDrawer(false);
  });
});

// ===== Segmented 跟手滑块（复刻 demo 的 dock-slider 缓动思路） =====
document.querySelectorAll('[data-segmented]').forEach(seg => {
  const slider = seg.querySelector('.seg-slider');
  const segments = Array.from(seg.querySelectorAll('.segment'));

  function positionSlider(el){
    const segRect = seg.getBoundingClientRect();
    const elRect = el.getBoundingClientRect();
    slider.style.left = (elRect.left - segRect.left - 3) + 'px';
    slider.style.width = elRect.width + 'px';
  }

  // 初始化
  const init = seg.querySelector('.segment.active') || segments[0];
  requestAnimationFrame(() => positionSlider(init));

  segments.forEach(s => {
    s.addEventListener('click', () => {
      segments.forEach(x => x.classList.remove('active'));
      s.classList.add('active');
      positionSlider(s);
    });
  });

  // 窗口尺寸变化时重排
  window.addEventListener('resize', () => {
    const active = seg.querySelector('.segment.active');
    if(active) positionSlider(active);
  });
});

// ===== 主题切换（深色/亮色） =====
const themeToggle = document.getElementById('themeToggle');
const themeDesc = document.getElementById('themeDesc');
const sunIcon = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.41 1.41m11.32 11.32l1.41 1.41M2 12h2m16 0h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>`;
const moonIcon = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>`;

function applyTheme(theme){
  const isDark = theme === 'dark';
  document.documentElement.setAttribute('data-theme', theme);
  themeToggle.classList.toggle('active', isDark);
  themeDesc.textContent = isDark ? '当前：深色主题' : '当前：亮色主题';
  try { localStorage.setItem('palink-theme', theme); } catch(e){}
}

// 初始化：读取存储 → 系统偏好 → 深色
(function initTheme(){
  let saved = null;
  try { saved = localStorage.getItem('palink-theme'); } catch(e){}
  const prefersLight = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
  const theme = saved || (prefersLight ? 'light' : 'dark');
  applyTheme(theme);
})();

themeToggle.addEventListener('click', () => {
  const next = themeToggle.classList.contains('active') ? 'light' : 'dark';
  applyTheme(next);
  showToast(next === 'dark' ? '已切换到深色' : '已切换到亮色');
});

// ===== 其他 Toggle（非主题） =====
document.querySelectorAll('.toggle:not(#themeToggle)').forEach(t => {
  t.addEventListener('click', () => {
    t.classList.toggle('active');
    showToast(t.classList.contains('active') ? '已开启' : '已关闭');
  });
});

// ===== 退出 =====
document.getElementById('logoutBtn').addEventListener('click', () => {
  showToast('退出登录（预览）');
});

// ===== 返回 =====
document.getElementById('headerBack').addEventListener('click', () => {
  showToast('离开设置（预览）');
});

// ===== Toast =====
const toast = document.getElementById('toast');
const toastMsg = document.getElementById('toastMsg');
let toastTimer = null;
function showToast(msg){
  toastMsg.textContent = msg;
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove('show'), 1400);
}

// ===== 滚动时同步抽屉高亮 =====
const sections = ['sec-profile','sec-appearance','sec-language','sec-ai','sec-admin','sec-data','sec-danger']
  .map(id => document.getElementById(id)).filter(Boolean);
scrollArea.addEventListener('scroll', () => {
  if(drawerOpen) return;
  const y = scrollArea.scrollTop + 80;
  let current = sections[0];
  for(const s of sections){
    if(s.offsetTop <= y) current = s;
  }
  drawer.querySelectorAll('.drawer-item').forEach(i => {
    i.classList.toggle('active', i.dataset.anchor === current.id);
  });
}, { passive: true });
</script>
