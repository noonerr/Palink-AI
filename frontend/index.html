<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- 注意：此处曾带 interactive-widget=overlays-content。
         其规范语义是「键盘不收缩 viewport，也不收缩 visual viewport」——
         与本项目依赖的「iOS 把 fixed bottom:0 顶到键盘上沿」机制直接冲突。
         iOS 若已实现该特性，会主动关掉 fixed 上推，导致哨兵测不到键盘高度、
         输入框落在布局视口底部被键盘盖住（即「视口显示页面顶部」）。
         保留它没有任何收益：不支持时被忽略，支持时有害。已移除。
         另：maximum-scale/user-scalable 在 iOS 10+ 默认被忽略，保留仅为安卓。 -->
    <!-- 【K21e 2026-10-01】viewport-fit=cover 已删除（实验）：cover 才是「向 iOS 申请
         画进安全区」的核心指令（K21c 删的 black-translucent 只是状态栏样式，对
         manifest 安装的 PWA 实测无效果）。删掉后 iOS 应按默认规则把 webview 放在
         状态栏与 Home Indicator 之间（393×759，底部齐 Home Indicator 区上沿）⇒
         dock 再下沉 ~25pt。代价=顶部内容不再延伸到状态栏背后（env→0，顶部变
         不透明系统条，K19 theme_color 快照继续染色）。回滚=恢复下面这段并重建重添：
         content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
         注意：viewport 相关只在「添加主屏幕」时快照，改后必须删 PWA 重添。 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- 缓存控制：配合 nginx no-store 策略，进一步防止 iOS Safari 内存缓存。
         注意必须是 no-store：no-cache 语义是「可存储但每次需校验」，iOS 在 304 判等上
         不可靠（K20 2026-09-30 实证：同名 CSS 被回 304、吃本地旧副本）；no-store 才是
         「禁止存储、每次必拉」。 -->
    <meta http-equiv="Cache-Control" content="no-store, max-age=0" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>Palink AI v0.21.2</title>
    
    <link rel="manifest" href="/manifest.json" />
    <!-- 【K18/K19 2026-09-03】theme-color 分工已重新实测（iOS 27.0 真机截图取证）：
         PWA（主屏幕 web app）模式下顶部系统栏颜色【只认 manifest 的 theme_color
         （添加主屏幕时快照）】，不读运行时 meta——运行时 meta 改什么、html/body 背景是什么
         都不影响系统栏（真机实证：meta=#f5f5f5 时系统栏仍是 #656565 深灰）。
         manifest 静态无法跟主题 → 启动脚本按主题换链接：亮=manifest.json(#F8FAFC)、
         暗=manifest-dark.json(#020617)，用户添加 PWA 时快照到正确主题色。
         本 meta 仍按主题动态设置，只影响浏览器模式（iOS 15+ 工具条染色）。 -->
    <!-- theme-color 必须与 manifest.json 的 theme_color 一致，避免启动阶段颜色跳变。
         颜色 = 当前画布色（与 App.tsx MobilePager 容器同源）：iOS 26/27 会采样
         html/body 背景色给顶部工具条与键盘区域染色，用旧渐变色会造成断层。 -->
    <meta name="theme-color" content="#020617" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Palink AI - 智能对话助手" />
    <meta name="application-name" content="Palink AI" />

    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- 【K21c 2026-10-01】black-translucent 已删除（实验）：WebKit Bug 316008 实证
         无此 meta 时 standalone 的 body 不再画到状态栏背后（webview 下移至状态栏
         下方）——正是 iOS 27.2「屏底 59pt 系统条带、网页不可达」（Bug 301994 变体，
         见 TODOS.md K21/K21b）唯一没试过的杠杆。验收=删 WebApp 重添后看屏底红线
         （viewportDebug K21c 探针）是否贴屏幕底 + envTop 读数 59→0；代价=顶部变
         不透明系统条（不再沉浸），颜色仍由 manifest theme_color 快照控制（K19）。
         回滚=恢复下面这行并重建重添（meta 只在添加主屏幕时读取，后补无效）：
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
         -->
    <meta name="apple-mobile-web-app-title" content="Palink" />
    <script>
      try {
        // 亮/暗/auto 三态与 App.tsx 主题解析对齐：auto 跟随系统
        // prefers-color-scheme，避免系统暗色用户在启动/加载阶段看到亮色闪屏。
        const storedTheme = localStorage.getItem('theme');
        const launchTheme = storedTheme === 'dark' || storedTheme === 'light'
          ? storedTheme
          : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        const launchBackground = launchTheme === 'dark' ? '#020617' : '#F8FAFC';
        document.documentElement.style.backgroundColor = launchBackground;
        document.documentElement.style.colorScheme = launchTheme;
        document.querySelector('meta[name="theme-color"]')?.setAttribute('content', launchBackground);
        // 【K19】iOS 26.1+/27 PWA 的系统状态栏颜色只认 manifest 的 theme_color，
        // 且是「添加到主屏幕」时的快照（运行时 meta 与 html/body 背景均不影响它，
        // 真机实证见 TODOS.md K18/K19）。manifest 是静态单文件无法跟主题，改为
        // 按启动主题换链接：暗色用户添加 PWA 时快照到 manifest-dark.json（#020617），
        // 亮色用默认 manifest.json（#F8FAFC），系统栏与画布同色、状态栏文字对比度正确。
        if (launchTheme === 'dark') {
          document.querySelector('link[rel="manifest"]')?.setAttribute('href', '/manifest-dark.json');
        }
      } catch {
        // Storage can be unavailable in hardened browsing modes.
      }
    </script>
    
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-192x192.png" />
    <link rel="apple-touch-icon" sizes="167x167" href="/icons/icon-192x192.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/icons/icon-152x152.png" />
    <link rel="apple-touch-icon" sizes="120x120" href="/icons/icon-128x128.png" />
    
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/icon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-32x32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/icons/icon-48x48.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192x192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512x512.png" />
    
    <meta name="msapplication-TileColor" content="#3b82f6" />
    <meta name="msapplication-tap-highlight" content="no" />
    <!-- 禁止iOS自动识别电话号码、邮箱，避免样式错乱 -->
    <meta name="format-detection" content="telephone=no, email=no" />
    <!-- KaTeX 公式样式：仅在消息含数学公式时由 MarkdownRenderer.ensureKatexCss 动态注入；
         这里静态引用只为保证 CSS 已就绪时公式立即有样式，改为异步加载避免阻塞首屏渲染
         （与下方 Font Awesome 同款 media=print 切换模式）。 -->
    <link rel="stylesheet" href="/katex.min.css" media="print" onload="this.media='all'" />
    <!-- ST 插件（如酒馆助手 Galgame 组件）依赖 Font Awesome 图标字体；
         窄视口下按钮文本被媒体查询隐藏，只剩 <i class="fa-solid"> 图标，
         不加载图标库会导致按钮空白。
         异步加载（media=print 切换）：不阻塞首屏渲染，CSS 到达后图标自行补上。 -->
    <link rel="stylesheet" href="/st/css/fontawesome.min.css" media="print" onload="this.media='all'" />
    <link rel="stylesheet" href="/st/css/solid.min.css" media="print" onload="this.media='all'" />
  </head>
  <body>
    <div id="root"></div>
    <script src="/bootstrap.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
