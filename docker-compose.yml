services:
  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: always

  backend:
    build: ./backend
    # --- DNS 配置 ---
    dns:
      - 223.5.5.5
      - 8.8.8.8
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    volumes:
      - ./backend/data:/app/data
      - ./backend/models:/app/models
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${DB_USER:-ai_user}:${DB_PASSWORD:-ai_password}@db:5432/${DB_NAME:-ai_hub}
      - HF_ENDPOINT=https://hf-mirror.com
      - MEMORY_EMBEDDING_PROVIDER=fastembed
      - MEMORY_VECTOR_DIMENSION=512
      - RUN_MIGRATIONS_ON_STARTUP=true
      - MIGRATIONS_FAIL_FAST=true
      - PROVIDER_SECRET_CHECK_STRICT=false
      - CHAT_HISTORY_LIMIT=24
      - CHARACTER_CHAT_HISTORY_LIMIT=24
      - WORKSPACE_ANALYZE_MAX_CHARS=12000
      - DB_POOL_SIZE=10
      - DB_MAX_OVERFLOW=20
      - DB_POOL_RECYCLE_SECONDS=1800
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    # -----------------------------------
    restart: always

  db:
    image: pgvector/pgvector:pg15
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=${DB_USER:-ai_user}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-ai_password}
      - POSTGRES_DB=${DB_NAME:-ai_hub}
    ports:
      - "5432:5432"
    # --- 关键修改：添加数据库健康检查 ---
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-ai_user} -d ${DB_NAME:-ai_hub}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # ---------------------------------
    restart: always

volumes:
  postgres_data: