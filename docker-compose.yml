services:
  frontend:
    build: ./frontend
    ports:
      - "3000:8080"
    depends_on:
      - backend
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - frontend-backend
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          memory: 128M

  backend:
    build: ./backend
    # --- DNS 配置 ---
    dns:
      - 223.5.5.5
      - 8.8.8.8
    command: sh /app/start-server.sh
    volumes:
      - ./backend/data:/app/data
      - ./backend/models:/app/models
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${DB_USER:-ai_user}:${DB_PASSWORD:?请在.env中设置DB_PASSWORD}@db:5432/${DB_NAME:-ai_hub}
      - HF_ENDPOINT=https://hf-mirror.com
      - MEMORY_EMBEDDING_PROVIDER=fastembed
      - MEMORY_VECTOR_DIMENSION=512
      - RUN_MIGRATIONS_ON_STARTUP=false
      - MIGRATIONS_FAIL_FAST=true
      - PROVIDER_SECRET_CHECK_STRICT=false
      - CHAT_HISTORY_LIMIT=24
      - CHARACTER_CHAT_HISTORY_LIMIT=24
      - WORKSPACE_ANALYZE_MAX_CHARS=12000
      - UVICORN_TIMEOUT=600
      - UVICORN_KEEPALIVE_TIMEOUT=600
      - APP_PERFORMANCE_PROFILE=eco
      - APP_MIN_WORKERS=1
      - APP_MAX_WORKERS=1
      - UVICORN_WORKERS_MAX=1
      - APP_MEMORY_RESERVE_MB=1536
      - APP_MEMORY_PER_WORKER_MB=900
      - APP_CPU_THREADS_PER_WORKER_MAX=4
      - DB_POOL_AUTO_TUNE=true
      - DB_CONNECTION_BUDGET=40
      - DB_POOL_RECYCLE_SECONDS=1800
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
    # -----------------------------------
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - frontend-backend
      - backend-db
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          memory: 512M

  db:
    image: pgvector/pgvector:pg15
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=${DB_USER:-ai_user}
      - POSTGRES_PASSWORD=${DB_PASSWORD:?请在.env中设置DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME:-ai_hub}
    expose:
      - "5432"
    # --- 关键修改：添加数据库健康检查 ---
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-ai_user} -d ${DB_NAME:-ai_hub}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # ---------------------------------
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - backend-db
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          memory: 256M

volumes:
  postgres_data:

networks:
  frontend-backend:
  backend-db:
