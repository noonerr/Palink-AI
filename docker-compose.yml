services:
  frontend:
    build: ./frontend
    ports:
      # [2026-08-31] 统一为 3000：dev/部署同端口，不再区分开发与部署。
      # 历史: 3000 曾被 WinNAT 动态保留段(2934-3033)吞掉临时改用 13000，现验证可绑定已改回
      - "3000:8080"
    depends_on:
      backend:
        condition: service_healthy
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - frontend-backend
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          memory: 128M

  ollama:
    image: ollama/ollama:latest
    container_name: palink-ollama
    ports:
      # 映射到宿主机便于调试（backend 走服务名 ollama:11434 直连，不依赖此映射）。
      # [PENTEST-2026-09-02] 收口到回环：Ollama 默认无鉴权，0.0.0.0 会把模型算力
      # 暴露给整个局域网；仅 127.0.0.1 可访问，容器网络内服务互连不受影响。
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_KEEP_ALIVE=24h
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - frontend-backend
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          memory: 512M

  # [可选网关 2026-08-31] new-api 模型网关：同模型多提供商的渠道聚合、失败转移与配额。
  # 默认不启动 —— 仅在 `docker compose --profile gateway up -d` 时拉起。
  # 不启用时 Palink 走「直连模式」（providers.json 里每个上游一条记录），backend 照常启动
  # （依赖 backend.depends_on.new-api.required=false）。
  # 启用后 providers.json 只需一条记录指向 http://new-api:3000/v1。
  # 详见根目录 SPEC_model_gateway_new_api.md §3 双模式。
  new-api:
    image: calciumion/new-api:latest
    container_name: palink-new-api
    profiles:
      - gateway
    ports:
      # 管理后台入口，**仅绑定 127.0.0.1 回环**，不在局域网暴露。
      # 宿主机侧刻意避开 3000：该端口落在 Windows 保留段(2934-3033)，docker 无法绑定
      # （同 frontend 的 TEMP-PORT 处置，见 TODOS.md「环境注意」）。
      - "127.0.0.1:13001:3000"
    expose:
      - "3000"
    volumes:
      # SQLite 实际库文件为 /data/one-api.db（不是 new-api.db），备份时认准前者
      - newapi_data:/data
    environment:
      - TZ=${TZ:-Asia/Shanghai}
      # 单节点非强制，但显式设置可避免容器重启后登录态失效。
      # ⚠️ 必须用 `:-` 默认值语法，不能用 `:-?`/`:?`：compose 的变量插值发生在
      # profile 过滤之前，用 `:?` 会让「未启用 gateway 的直连模式用户」
      # 的 docker compose up -d 直接失败（已实测验证）。启用网关前务必在
      # .env 里设置 NEWAPI_SESSION_SECRET 替换掉下面这个弱默认值。
      - SESSION_SECRET=${NEWAPI_SESSION_SECRET:-palink-newapi-change-me-before-use}
      # 预设 root 令牌，便于后续用管理 API 自动化签发用户令牌（P2 懒签发）
      - INITIAL_ROOT_TOKEN=${NEWAPI_ROOT_TOKEN:-}
    restart: always
    healthcheck:
      # 用 wget 而非 curl（镜像通常无 curl）；根路径返回前端页面即视为存活
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:3000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - frontend-backend
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          memory: 128M

  backend:
    build: ./backend
    # --- DNS 配置 ---
    dns:
      - 223.5.5.5
      - 8.8.8.8
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: sh /app/start-server.sh
    volumes:
      - ./backend/data:/app/data
      - ./backend/models:/app/models
      - ./backend/tests:/app/tests
      # C7/N-17 容器 pytest 对齐：只读挂载前端源码，供三个契约测试探测运行
      # （compose 相对路径以本文件所在目录为基准，故为 ./frontend）
      - ./frontend:/opt/frontend-src:ro
    env_file:
      - .env
    environment:
      # 时间宏（{{time}}/{{date}} 等）的本地时区基准；.env 可覆盖
      - TZ=${TZ:-Asia/Shanghai}
      - DATABASE_URL=postgresql://${DB_USER:-ai_user}:${DB_PASSWORD:?请在.env中设置DB_PASSWORD}@db:5432/${DB_NAME:-ai_hub}
      - HF_ENDPOINT=https://hf-mirror.com
      - HF_HUB_DISABLE_XET=1
      # 向量引擎统一走 Ollama + bge-m3（同 compose 网络内服务名直连，见 TODOS.md）；
      # Ollama 不可达时 OllamaEmbedder 自动降级 fastembed，无需 sentence-transformers。
      - MEMORY_EMBEDDING_PROVIDER=ollama
      # 按型号 token 计数（token_counter_service）：HF 词表下载缓存持久化到挂载卷，
      # 容器重建后无需重新下载（deepseek/qwen 等词表约 2-11MB/个）
      - HF_HUB_CACHE=/app/data/hf_cache
      - OLLAMA_HOST=http://ollama:11434
      - OLLAMA_MODEL=bge-m3
      - MEMORY_VECTOR_DIMENSION=1024
      - RUN_MIGRATIONS_ON_STARTUP=false
      - MIGRATIONS_FAIL_FAST=true
      - PROVIDER_SECRET_CHECK_STRICT=false
      - CHAT_HISTORY_LIMIT=24
      - CHARACTER_CHAT_HISTORY_LIMIT=24
      - WORKSPACE_ANALYZE_MAX_CHARS=12000
      - UVICORN_TIMEOUT=600
      - UVICORN_KEEPALIVE_TIMEOUT=600
      - APP_PERFORMANCE_PROFILE=eco
      - APP_MIN_WORKERS=1
      - APP_MAX_WORKERS=1
      - UVICORN_WORKERS_MAX=1
      - APP_MEMORY_RESERVE_MB=1536
      - APP_MEMORY_PER_WORKER_MB=900
      - APP_CPU_THREADS_PER_WORKER_MAX=4
      - DB_POOL_AUTO_TUNE=true
      - DB_CONNECTION_BUDGET=40
      - DB_POOL_RECYCLE_SECONDS=1800
      - SEARXNG_PROXY_API_KEY=${SEARXNG_PROXY_API_KEY:-}
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_healthy
      # 可选模型网关（profiles: gateway）。required=false 是关键：
      # 未启用 gateway profile 时 new-api 不存在，backend 仍须正常启动。
      new-api:
        condition: service_started
        required: false
    # -----------------------------------
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 180s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - frontend-backend
      - backend-db
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          memory: 512M

  db:
    image: pgvector/pgvector:pg15
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=${DB_USER:-ai_user}
      - POSTGRES_PASSWORD=${DB_PASSWORD:?请在.env中设置DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME:-ai_hub}
    expose:
      - "5432"
    # --- 关键修改：添加数据库健康检查 ---
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-ai_user} -d ${DB_NAME:-ai_hub}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # ---------------------------------
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - backend-db
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          memory: 256M

volumes:
  postgres_data:
  ollama_data:
  newapi_data:

networks:
  frontend-backend:
  backend-db:
