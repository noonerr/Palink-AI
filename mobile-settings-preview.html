<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>Palink AI - Settings Preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --font-sans:'Manrope','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;
  --primary:#3b82f6;--primary-light:#60a5fa;--primary-glow:rgba(59,130,246,.15);
  --bg-deep:#0f0f1a;--bg-card:rgba(20,20,30,.85);--bg-card-solid:rgba(28,28,42,.95);
  --bg-item:rgba(255,255,255,.04);--bg-item-hover:rgba(255,255,255,.07);
  --border:rgba(255,255,255,.07);--border-light:rgba(255,255,255,.1);
  --text-primary:#f0f0f5;--text-secondary:#9ca3af;--text-muted:#6b7280;
  --danger:#ef4444;--danger-bg:rgba(239,68,68,.08);--danger-border:rgba(239,68,68,.2);
  --success:#22c55e;--success-bg:rgba(34,197,94,.1);
  --radius:16px;--radius-sm:12px;--radius-xs:10px;
  --safe-top:env(safe-area-inset-top,0px);--safe-bottom:env(safe-area-inset-bottom,0px);
}
html,body{
  height:100%;font-family:var(--font-sans);-webkit-font-smoothing:antialiased;
  overflow:hidden;background:var(--bg-deep);color:var(--text-primary);
}
body{display:flex;flex-direction:column;height:100vh;height:100dvh}

/* ===== Aurora Background ===== */
.aurora{
  position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;
}
.aurora-blob{
  position:absolute;border-radius:50%;filter:blur(100px);opacity:.12;will-change:transform;
}
.aurora-blob:nth-child(1){
  width:500px;height:500px;background:linear-gradient(135deg,#3b82f6,#06b6d4);
  top:-120px;left:-80px;animation:af1 20s infinite ease-in-out alternate;
}
.aurora-blob:nth-child(2){
  width:400px;height:400px;background:linear-gradient(135deg,#8b5cf6,#3b82f6);
  bottom:-80px;right:-40px;animation:af2 18s infinite ease-in-out alternate;
}
.aurora-blob:nth-child(3){
  width:300px;height:300px;background:linear-gradient(135deg,#06b6d4,#8b5cf6);
  top:40%;left:50%;transform:translate(-50%,-50%);animation:af3 25s infinite ease-in-out alternate;opacity:.06;
}
@keyframes af1{0%{transform:translate(0,0) scale(1)}50%{transform:translate(40px,25px) scale(1.08)}100%{transform:translate(-25px,40px) scale(.95)}}
@keyframes af2{0%{transform:translate(0,0) scale(1)}50%{transform:translate(-35px,-25px) scale(1.04)}100%{transform:translate(25px,-40px) scale(.9)}}
@keyframes af3{0%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(calc(-50%+25px),calc(-50%-15px)) scale(1.1)}100%{transform:translate(calc(-50%-15px),calc(-50%+25px)) scale(.85)}}

/* ===== Header ===== */
.header{
  position:relative;z-index:10;flex-shrink:0;
  padding:calc(var(--safe-top) + 12px) 20px 14px;
  background:linear-gradient(180deg,rgba(15,15,26,.95) 0%,rgba(15,15,26,.7) 70%,transparent 100%);
  backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  border-bottom:1px solid var(--border);
}
.header-inner{display:flex;align-items:center;justify-content:space-between;height:44px}
.header-back{
  display:flex;align-items:center;gap:4px;background:none;border:none;
  color:var(--primary-light);font-size:15px;font-weight:600;cursor:pointer;
  padding:8px 4px 8px 0;font-family:var(--font-sans);
}
.header-back svg{flex-shrink:0}
.header-title{font-size:18px;font-weight:700;letter-spacing:-.01em}
.header-spacer{width:60px}

/* ===== Scrollable Content ===== */
.scroll-area{
  flex:1;overflow-y:auto;overflow-x:hidden;position:relative;z-index:1;
  -webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  scrollbar-width:none;padding-bottom:calc(var(--safe-bottom) + 24px);
}
.scroll-area::-webkit-scrollbar{display:none}
.content{padding:20px 16px;display:flex;flex-direction:column;gap:24px}

/* ===== Glass Card ===== */
.glass{
  background:var(--bg-card);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;
}

/* ===== Profile Card ===== */
.profile-card{
  padding:24px 20px;text-align:center;position:relative;
  background:linear-gradient(135deg,rgba(59,130,246,.08) 0%,rgba(139,92,246,.06) 100%);
}
.profile-card::before{
  content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);
  width:120px;height:120px;border-radius:50%;
  background:radial-gradient(circle,rgba(59,130,246,.12) 0%,transparent 70%);
  filter:blur(40px);pointer-events:none;
}
.avatar-wrap{
  position:relative;display:inline-flex;margin-bottom:16px;
}
.avatar{
  width:80px;height:80px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:36px;background:linear-gradient(135deg,#3b82f6 0%,#8b5cf6 100%);
  box-shadow:0 8px 32px rgba(59,130,246,.25),0 0 0 3px rgba(59,130,246,.15);
  position:relative;z-index:1;
}
.avatar-badge{
  position:absolute;bottom:2px;right:2px;width:24px;height:24px;border-radius:50%;
  background:var(--primary);border:3px solid rgba(20,20,30,.95);
  display:flex;align-items:center;justify-content:center;z-index:2;
}
.avatar-badge svg{color:#fff}
.profile-name{font-size:20px;font-weight:700;margin-bottom:4px;letter-spacing:-.01em}
.profile-role{
  display:inline-flex;align-items:center;gap:4px;
  font-size:12px;font-weight:600;color:var(--primary-light);
  padding:3px 10px;border-radius:20px;
  background:var(--primary-glow);border:1px solid rgba(59,130,246,.15);
}

/* ===== Section ===== */
.section{display:flex;flex-direction:column;gap:8px}
.section-header{
  display:flex;align-items:center;gap:8px;padding:0 4px;
  font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;
  color:var(--text-muted);
}
.section-header svg{opacity:.6}
.section-header::after{
  content:'';flex:1;height:1px;background:linear-gradient(90deg,var(--border) 0%,transparent 100%);
}

/* ===== Menu Items ===== */
.menu-group{display:flex;flex-direction:column;gap:2px}
.menu-item{
  display:flex;align-items:center;gap:14px;padding:14px 16px;
  background:transparent;border:none;cursor:pointer;
  transition:all .18s ease;font-family:var(--font-sans);width:100%;
  color:var(--text-primary);font-size:15px;font-weight:500;
  position:relative;text-align:left;
  min-height:52px;
}
.menu-item:first-child{border-radius:var(--radius-sm) var(--radius-sm) 0 0}
.menu-item:last-child{border-radius:0 0 var(--radius-sm) var(--radius-sm)}
.menu-item:only-child{border-radius:var(--radius-sm)}
.menu-item+.menu-item{border-top:1px solid var(--border)}
.menu-item:active{transform:scale(.985);background:var(--bg-item-hover)}
.menu-item:hover{background:var(--bg-item)}
.menu-icon{
  width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;
  flex-shrink:0;font-size:14px;
}
.menu-icon.blue{background:rgba(59,130,246,.12);color:#60a5fa}
.menu-icon.purple{background:rgba(139,92,246,.12);color:#a78bfa}
.menu-icon.amber{background:rgba(245,158,11,.12);color:#fbbf24}
.menu-icon.green{background:rgba(34,197,94,.12);color:#4ade80}
.menu-icon.pink{background:rgba(236,72,153,.12);color:#f472b6}
.menu-icon.cyan{background:rgba(6,182,212,.12);color:#22d3ee}
.menu-icon.red{background:rgba(239,68,68,.12);color:#f87171}
.menu-icon.slate{background:rgba(148,163,184,.1);color:#94a3b8}
.menu-label{flex:1;min-width:0}
.menu-label-main{font-size:15px;font-weight:500;line-height:1.3}
.menu-label-desc{font-size:12px;color:var(--text-muted);line-height:1.4;margin-top:2px}
.menu-arrow{color:var(--text-muted);flex-shrink:0;opacity:.5}
.menu-badge{
  font-size:11px;font-weight:700;padding:2px 8px;border-radius:10px;
  background:var(--success-bg);color:var(--success);flex-shrink:0;
}

/* ===== Toggle Item ===== */
.toggle-item{
  display:flex;align-items:center;gap:14px;padding:14px 16px;
  position:relative;min-height:52px;
}
.toggle-item+.toggle-item{border-top:1px solid var(--border)}
.toggle-label{flex:1;min-width:0}
.toggle-label-main{font-size:15px;font-weight:500;line-height:1.3}
.toggle-label-desc{font-size:12px;color:var(--text-muted);line-height:1.4;margin-top:2px}
.toggle{
  position:relative;width:48px;height:28px;border-radius:14px;
  background:rgba(255,255,255,.12);border:1px solid var(--border-light);
  cursor:pointer;transition:all .25s ease;flex-shrink:0;
}
.toggle.active{background:var(--primary);border-color:var(--primary)}
.toggle::after{
  content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;
  border-radius:50%;background:#fff;transition:transform .25s cubic-bezier(.4,0,.2,1);
  box-shadow:0 2px 6px rgba(0,0,0,.2);
}
.toggle.active::after{transform:translateX(20px)}

/* ===== Segmented Control ===== */
.segmented{
  display:flex;gap:0;padding:3px;border-radius:12px;
  background:rgba(255,255,255,.06);border:1px solid var(--border);
  width:100%;
}
.segment{
  flex:1;padding:8px 12px;border-radius:10px;border:none;cursor:pointer;
  font-family:var(--font-sans);font-size:13px;font-weight:600;
  background:transparent;color:var(--text-muted);
  transition:all .2s ease;text-align:center;
}
.segment.active{
  background:var(--primary);color:#fff;
  box-shadow:0 2px 8px rgba(59,130,246,.3);
}

/* ===== Danger Zone ===== */
.danger-card{
  border-color:var(--danger-border) !important;
  background:linear-gradient(135deg,rgba(239,68,68,.04) 0%,rgba(239,68,68,.02) 100%) !important;
}
.danger-header{
  display:flex;align-items:center;gap:10px;padding:16px;
  color:var(--danger);font-size:14px;font-weight:600;
  border-bottom:1px solid var(--danger-border);
}
.danger-header svg{flex-shrink:0}

/* ===== Logout Button ===== */
.logout-btn{
  width:100%;padding:14px;border:none;cursor:pointer;
  font-family:var(--font-sans);font-size:15px;font-weight:600;
  color:var(--danger);background:transparent;
  display:flex;align-items:center;justify-content:center;gap:8px;
  transition:all .18s ease;
}
.logout-btn:active{background:var(--danger-bg);transform:scale(.985)}

/* ===== Footer ===== */
.footer{
  text-align:center;padding:8px 16px 16px;
  font-size:11px;color:var(--text-muted);opacity:.6;
  position:relative;z-index:1;
}

/* ===== Animations ===== */
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.animate-in{animation:fadeUp .4s ease-out both}
.animate-in:nth-child(1){animation-delay:.05s}
.animate-in:nth-child(2){animation-delay:.1s}
.animate-in:nth-child(3){animation-delay:.15s}
.animate-in:nth-child(4){animation-delay:.2s}
.animate-in:nth-child(5){animation-delay:.25s}
.animate-in:nth-child(6){animation-delay:.3s}
.animate-in:nth-child(7){animation-delay:.35s}
.animate-in:nth-child(8){animation-delay:.4s}
</style>
</head>
<body>

<!-- Aurora Background -->
<div class="aurora">
  <div class="aurora-blob"></div>
  <div class="aurora-blob"></div>
  <div class="aurora-blob"></div>
</div>

<!-- Header -->
<div class="header">
  <div class="header-inner">
    <button class="header-back">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      返回
    </button>
    <span class="header-title">设置</span>
    <div class="header-spacer"></div>
  </div>
</div>

<!-- Scrollable Content -->
<div class="scroll-area">
  <div class="content">

    <!-- Profile Card -->
    <div class="glass profile-card animate-in">
      <div class="avatar-wrap">
        <div class="avatar">🦊</div>
        <div class="avatar-badge">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M20 6L9 17l-5-5"/></svg>
        </div>
      </div>
      <div class="profile-name">Pall</div>
      <span class="profile-role">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
        管理员
      </span>
    </div>

    <!-- Account Section -->
    <div class="section animate-in">
      <div class="section-header">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        账户
      </div>
      <div class="glass menu-group">
        <button class="menu-item">
          <div class="menu-icon blue">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          </div>
          <div class="menu-label">
            <div class="menu-label-main">个人资料</div>
            <div class="menu-label-desc">头像、用户名、密码管理</div>
          </div>
          <svg class="menu-arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 18l6-6-6-6"/></svg>
        </button>
        <button class="menu-item">
          <div class="menu-icon purple">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          </div>
          <div class="menu-label">
            <div class="menu-label-main">原创角色 (OC)</div>
            <div class="menu-label-desc">创建和管理你的原创角色</div>
          </div>
          <svg class="menu-arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 18l6-6-6-6"/></svg>
        </button>
      </div>
    </div>

    <!-- Appearance Section -->
    <div class="section animate-in">
      <div class="section-header">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.41 1.41m11.32 11.32l1.41 1.41M2 12h2m16 0h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
        外观与显示
      </div>
      <div class="glass menu-group">
        <div class="toggle-item">
          <div class="menu-icon cyan">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
          </div>
          <div class="toggle-label">
            <div class="toggle-label-main">深色模式</div>
            <div class="toggle-label-desc">当前: 深色主题</div>
          </div>

        </div>
        <div class="toggle-item">
          <div class="menu-icon amber">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
          </div>
          <div class="toggle-label">
            <div class="toggle-label-main">模型深度思考</div>
            <div class="toggle-label-desc">显示模型的思考过程</div>
          </div>
          <div class="toggle" onclick="this.classList.toggle('active')"></div>
        </div>
        <div style="padding:14px 16px">
          <div style="display:flex;align-items:center;gap:14px;margin-bottom:10px">
            <div class="menu-icon green">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8m-4-4v4"/></svg>
            </div>
            <div>
              <div class="toggle-label-main">角色扮演显示模式</div>
              <div class="toggle-label-desc">选择对话的呈现方式</div>
            </div>
          </div>
          <div class="segmented">
            <button class="segment active" onclick="activateSegment(this)">分框模式</button>
            <button class="segment" onclick="activateSegment(this)">无分框模式</button>
          </div>
        </div>
        <div style="padding:14px 16px">
          <div style="display:flex;align-items:center;gap:14px;margin-bottom:10px">
            <div class="menu-icon slate">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/></svg>
            </div>
            <div>
              <div class="toggle-label-main">记忆模式</div>
              <div class="toggle-label-desc">向量记忆提供更好的语义理解</div>
            </div>
          </div>
          <div class="segmented">
            <button class="segment" onclick="activateSegment(this)">规则记忆</button>
            <button class="segment active" onclick="activateSegment(this)">向量记忆</button>

        </div>
      </div>
    </div>

    <!-- Language Section -->
    <div class="section animate-in">
      <div class="section-header">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
        语言
      </div>
      <div class="glass menu-group">
        <div style="padding:14px 16px">
          <div style="display:flex;align-items:center;gap:14px;margin-bottom:10px">
            <div class="menu-icon blue">
              <span style="font-size:16px;font-weight:700">ZH</span>
            </div>
            <div>
              <div class="toggle-label-main">语言设置</div>
              <div class="toggle-label-desc">同时设置界面语言和AI提示词语言</div>
            </div>
          </div>
          <div class="segmented">
            <button class="segment active" onclick="activateSegment(this)">中文</button>
            <button class="segment" onclick="activateSegment(this)">English</button>
          </div>
        </div>
      </div>
    </div>

    <!-- AI & Model Section -->
    <div class="section animate-in">
      <div class="section-header">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 8V4H8"/><rect x="8" y="2" width="8" height="4" rx="1"/><path d="M4 12a1 1 0 0 1-1-1V8a1 1 0 0 1 1-1h16a1 1 0 0 1 1 1v3a1 1 0 0 1-1 1"/><path d="M6 12v7a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2v-7"/><path d="M10 16h4"/></svg>
        AI 与模型
      </div>
      <div class="glass menu-group">
        <button class="menu-item">
          <div class="menu-icon amber">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
          </div>
          <div class="menu-label">
            <div class="menu-label-main">提示词管理</div>
            <div class="menu-label-desc">自定义系统提示词模板</div>
          </div>
          <svg class="menu-arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 18l6-6-6-6"/></svg>
        </button>
        <button class="menu-item">
          <div class="menu-icon pink">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8m-4-4v4"/></svg>
          </div>
          <div class="menu-label">
            <div class="menu-label-main">模型管理</div>
            <div class="menu-label-desc">配置和管理AI模型服务</div>
