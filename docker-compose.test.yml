# ⚠️ palink-new 真机验收栈（独立编排，2026-10-04）
#
# 与 `docker-compose.yml` 的关系：**互不干扰**，但复用原栈的 ollama / new-api 容器。
# 原因：ollama 里的 bge-m3 模型（~1.2GB）下载耗时且占盘，新栈重复拉一份纯属浪费；
#      new-api 是模型网关，纯外部依赖。两者通过 host 网络地址访问。
#
# 隔离清单（逐条核对过）：
#   ① 容器名 palink-new-*，与 palink-ai-* / palink-ollama 无冲突
#   ② 端口 13100（前端）/ 13101（后端，仅 127.0.0.1）；原栈 13000/13001/11434 不受影响
#   ③ 独立网络 palink-new-net
#   ④ **独立数据库卷** palinknew_pgdata —— 新库是空的，不碰原栈业务数据
#   ⑤ 前端 dist 挂自己的 ./frontend/dist（与原栈不同目录）
#
# 启动：
#   docker compose -p palink-new -f docker-compose.test.yml up -d --build
#   打开 http://localhost:13100
#
# 停止：
#   docker compose -p palink-new -f docker-compose.test.yml down
#   （加 -v 会删新库卷；不加则保留，便于二次测试保留账号与卡片）
#
# ⚠️ 新库是空的：需重新注册账号。若想直接用原栈的卡片数据，见文件末尾「数据迁移」。

services:
  frontend:
    build: ./frontend
    container_name: palink-new-frontend-1
    ports:
      - "13100:8080"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - newnet
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  backend:
    build: ./backend
    container_name: palink-new-backend-1
    dns:
      - 223.5.5.5
      - 8.8.8.8
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: sh /app/start-server.sh
    volumes:
      - ./backend/data:/app/data
      - ./backend/models:/app/models
      - ./backend/tests:/app/tests
      - ./frontend:/opt/frontend-src:ro
    env_file:
      - .env
    environment:
      - TZ=${TZ:-Asia/Shanghai}
      # 内网服务名在本栈不存在，改为宿主地址（extra_hosts 已提供 host.docker.internal）
      - DATABASE_URL=postgresql://${DB_USER:-ai_user}:${DB_PASSWORD:?请在.env中设置DB_PASSWORD}@db:5432/${DB_NAME:-ai_hub}
      - HF_ENDPOINT=https://hf-mirror.com
      - HF_HUB_DISABLE_XET=1
      - MEMORY_EMBEDDING_PROVIDER=ollama
      - HF_HUB_CACHE=/app/data/hf_cache
      # [关键] 复用原栈 ollama（已下好 bge-m3），不重复部署省 1.2GB 磁盘与下载时间
      - OLLAMA_HOST=http://host.docker.internal:11434
      - OLLAMA_MODEL=bge-m3
      - MEMORY_VECTOR_DIMENSION=1024
      - RUN_MIGRATIONS_ON_STARTUP=false
      - MIGRATIONS_FAIL_FAST=true
      - PROVIDER_SECRET_CHECK_STRICT=false
      - CHAT_HISTORY_LIMIT=24
      - CHARACTER_CHAT_HISTORY_LIMIT=24
      - WORKSPACE_ANALYZE_MAX_CHARS=12000
      - UVICORN_TIMEOUT=600
      - UVICORN_KEEPALIVE_TIMEOUT=600
      - APP_PERFORMANCE_PROFILE=eco
      - APP_MIN_WORKERS=1
      - APP_MAX_WORKERS=1
      - UVICORN_WORKERS_MAX=1
      - APP_MEMORY_RESERVE_MB=1536
      - APP_MEMORY_PER_WORKER_MB=900
      - APP_CPU_THREADS_PER_WORKER_MAX=4
      - DB_POOL_AUTO_TUNE=true
      - DB_CONNECTION_BUDGET=40
      - DB_POOL_RECYCLE_SECONDS=1800
      - SEARXNG_PROXY_API_KEY=${SEARXNG_PROXY_API_KEY:-}
    ports:
      # 仅本机可见，供看 /health 与调试；外部走前端 nginx 反代
      - "127.0.0.1:13101:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 180s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - newnet
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G

  db:
    image: pgvector/pgvector:pg15
    container_name: palink-new-db-1
    environment:
      - POSTGRES_USER=${DB_USER:-ai_user}
      - POSTGRES_PASSWORD=${DB_PASSWORD:?请在.env中设置DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME:-ai_hub}
    volumes:
      # ⚠️ 独立卷：绝不与原栈 postgres_data 混用
      - newpgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-ai_user} -d ${DB_NAME:-ai_hub}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - newnet

networks:
  newnet:
    name: palink-new-net
    driver: bridge

volumes:
  newpgdata:
    name: palinknew_pgdata

# ─────────────────────────────────────────────────────────────
# 数据迁移（可选，测试串味/记忆类问题时需要）
#
# 新库是空的。要把原栈的卡片与会话搬过来，在原栈的 db 容器里导出：
#   docker exec palink-ai-db-1 pg_dump -U ai_user ai_hub > /tmp/dump.sql
#   docker cp palink-ai-db-1:/tmp/dump.sql ./seed.sql
#   docker cp ./seed.sql palink-new-db-1:/tmp/seed.sql
#   docker exec -i palink-new-db-1 psql -U ai_user -d ai_hub < ./seed.sql
#
# ⚠️ 迁移后必须让后端跑 alembic 补新列（本批新增 conversation_memories.character_id）：
#   docker exec palink-new-backend-1 sh -c "cd /app && alembic upgrade head"
#   或临时设 RUN_MIGRATIONS_ON_STARTUP=true 重建 backend 容器。
#
# 提醒：palinknew_pgdata 是**新栈专属**，删除它不会影响原栈数据。
# ─────────────────────────────────────────────────────────────