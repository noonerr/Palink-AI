services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/index.html:/app/index.html
      - ./frontend/vite.config.js:/app/vite.config.js
    ports:
      - "3000:8080"
    environment:
      - DOCKER_DEV=1
    command: npm run dev -- --host 0.0.0.0 --port 8080
    networks:
      - palink-ai_frontend-backend

# sillytavern 服务已于 2026-09-05 删除：st-native 双轨剥离（2026-09-03）移除了
# SillyTavern-1.18.0/ 源码副本，本文件的 build context 早已指向不存在的目录
# （一起即挂）。dev 环境只需 frontend 服务。

networks:
  palink-ai_frontend-backend:
    external: true
