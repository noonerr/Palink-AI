server {
    listen 8080;
    charset utf-8;
    absolute_redirect off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/plain application/javascript text/css application/json application/wasm image/svg+xml font/woff2 application/xml text/javascript;
    client_max_body_size 10g;

    location = / {
        if ($http_user_agent ~* "(iphone|ipod|ipad)") {
            return 302 /mobile/chat;
        }
        if ($http_cookie ~* "ui_variant=desktop") {
            return 302 /desktop/chat;
        }
        if ($http_cookie ~* "ui_variant=mobile") {
            return 302 /mobile/chat;
        }
        if ($http_user_agent ~* "(android|webos|iphone|ipad|ipod|blackberry|iemobile|opera mini|mobile)") {
            return 302 /mobile/chat;
        }
        return 302 /desktop/chat;
    }

    location = /desktop {
        return 302 /desktop/chat;
    }

    location = /mobile {
        return 302 /mobile/chat;
    }

    location = /set-ui/desktop {
        add_header Set-Cookie "ui_variant=desktop; Path=/; Max-Age=31536000; SameSite=Lax";
        return 302 /desktop/chat;
    }

    location = /set-ui/mobile {
        add_header Set-Cookie "ui_variant=mobile; Path=/; Max-Age=31536000; SameSite=Lax";
        return 302 /mobile/chat;
    }

    location = /set-ui/auto {
        add_header Set-Cookie "ui_variant=; Path=/; Max-Age=0; SameSite=Lax";
        return 302 /;
    }

    location = /manifest.json {
        alias /usr/share/nginx/html/manifest.json;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location = /sw.js {
        alias /usr/share/nginx/html/sw.js;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location = /desktop/manifest.json {
        alias /usr/share/nginx/html/manifest.json;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location = /mobile/manifest.json {
        alias /usr/share/nginx/html/manifest.json;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location = /desktop/sw.js {
        alias /usr/share/nginx/html/sw.js;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location = /mobile/sw.js {
        alias /usr/share/nginx/html/sw.js;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location ~* \.[a-f0-9]+\.(js|css)$ {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location ^~ /desktop/ {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    location ^~ /mobile/ {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    location /icons/ {
        alias /usr/share/nginx/html/icons/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 600s;
        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
    }
}
