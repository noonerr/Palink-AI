<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Palink 状态预览（Palink 风格改皮版）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Sora:wght@600;700&display=swap">
<style>
/* ============================================================
   Palink 风格改皮版（2026-10-03）
   原件：docs/报错提示系统重写_手机端UI原型_2026-09-30.html
   本版只换「皮」：变量值 / 字体 / 字号 / blur 用法 / 圆角 / 图标字形。
   结构、类名、选择器、交互逻辑一律未动，可与原件逐屏对照。
   色温规则：所有中性色色相 200°–250° 或无饱和；禁止橙/黄/棕中性色与阴影。
   ============================================================ */
:root{--bg:#F1F5F9;--chat:#F8FAFC;--card:#FFFFFF;--glass:rgba(248,250,252,.80);--text:#09090B;--muted:#71717A;--line:#E4E4E7;--blue:#3C83F6;--blue-text:#2563EB;--blue-soft:#EFF6FF;--danger:#DC2626;--warn:#D97706;--ok:#16A34A;--bubble:#0F172A;--shadow:0 10px 26px rgba(0,0,0,.06)}
[data-theme=dark]{--bg:#0B1120;--chat:#020617;--card:#0F172A;--glass:rgba(15,23,42,.78);--text:#FAFAFA;--muted:#A1A1AA;--line:#27272A;--blue:#3C83F6;--blue-text:#9AB5FF;--blue-soft:#16233D;--danger:#ED9188;--warn:#DDBB97;--ok:#9DCCB0;--bubble:#1E293B;--shadow:0 12px 30px rgba(0,0,0,.34)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font:15px/1.6 'Manrope','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif;color:var(--text);background:var(--bg)}body{display:grid;place-items:center;padding:20px}.wrap{width:min(430px,100%)}.toolbar{display:flex;align-items:center;gap:8px;margin-bottom:10px}.toolbar select,.toolbar button{height:34px;border:1px solid var(--line);border-radius:999px;background:var(--card);color:var(--text);font-size:13px}.toolbar select{flex:1;padding:0 12px}.toolbar button{padding:0 14px;color:var(--muted);cursor:pointer;font-family:'Sora','Manrope','PingFang SC',sans-serif}.phone{position:relative;height:min(844px,calc(100svh - 86px));min-height:680px;overflow:hidden;border:1px solid var(--line);border-radius:30px;background:var(--chat);box-shadow:var(--shadow)}.top{position:absolute;inset:0 0 auto;height:116px;z-index:5;background:linear-gradient(var(--card),rgba(248,250,252,0))}
[data-theme=dark] .top{background:linear-gradient(var(--card),rgba(2,6,23,0))}
.notch{width:104px;height:27px;margin:8px auto 0;border-radius:18px;background:#16181e}.status{position:absolute;left:19px;right:19px;top:7px;color:#fff;font-size:12px;font-weight:600;display:flex;justify-content:space-between}.head{position:absolute;top:52px;left:0;right:0;height:58px;display:flex;align-items:center;gap:10px;padding:0 17px}.avatar{width:36px;height:36px;border-radius:14px;background:#64748B;color:#fff;display:grid;place-items:center;font-weight:600;font-family:'Sora','Manrope','PingFang SC',sans-serif}.who{flex:1}.who b{display:block;font-size:15px;font-weight:600;font-family:'Sora','Manrope','PingFang SC',sans-serif}.who span{display:block;color:var(--muted);font-size:12px}.head button{width:32px;height:32px;border:1px solid var(--line);border-radius:50%;background:transparent;color:var(--muted);font-size:17px}.messages{position:absolute;inset:116px 0 130px;padding:18px 15px;overflow:hidden}.date{margin-bottom:15px;text-align:center;color:var(--muted);font-size:12px}.msg{font-size:15px;line-height:1.6}.user{width:max-content;max-width:84%;margin-left:auto;padding:9px 12px;color:#fff;background:var(--bubble);border-radius:21px 21px 7px 21px}.assistant{margin-top:14px}.time{display:block;margin-top:3px;color:var(--muted);font-size:12px}.user .time{color:rgba(255,255,255,.55)}
/* 报错卡：实底 --card + --border，不用 backdrop-filter（Palink .glass 本就是实底无 blur） */
.state{display:none;align-items:center;gap:10px;margin-top:14px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--card);box-shadow:var(--shadow)}
.state.show{display:flex}.mark{width:26px;height:26px;border-radius:999px;display:grid;place-items:center;flex:none}.mark svg{width:15px;height:15px;stroke-width:2}.err .mark{background:color-mix(in srgb,var(--danger) 12%,transparent);color:var(--danger)}.warn .mark{background:color-mix(in srgb,var(--warn) 14%,transparent);color:var(--warn)}.ok .mark{background:color-mix(in srgb,var(--ok) 14%,transparent);color:var(--ok)}.copy{flex:1;min-width:0}.copy b{display:block;font-size:15px;font-weight:600;font-family:'Sora','Manrope','PingFang SC',sans-serif}.copy span{display:block;color:var(--muted);font-size:13px;white-space:nowrap}.state button{border:0;background:transparent;color:var(--blue-text);font-size:13px;cursor:pointer;font-family:inherit}.state .x{width:22px;padding:0;color:var(--muted);display:grid;place-items:center}.state .x svg{width:16px;height:16px;stroke-width:2}
/* toast：单行细条胶囊，实底无 blur */
.toast{position:absolute;top:118px;left:14px;right:14px;z-index:7;display:none;align-items:center;gap:8px;padding:10px 12px;border:1px solid var(--line);border-radius:999px;background:var(--card);box-shadow:var(--shadow);font-size:13px}
.toast.show{display:flex}.dot{width:8px;height:8px;border-radius:50%;background:var(--blue);flex:none}.toast.ok .dot{background:var(--ok)}.toast.warn .dot{background:var(--warn)}.toast span{color:var(--muted)}.toast .x{margin-left:auto;border:0;background:transparent;color:var(--muted);display:grid;place-items:center;padding:0}.toast .x svg{width:16px;height:16px;stroke-width:2}.composer{position:absolute;left:13px;right:13px;bottom:75px;height:56px;z-index:4;display:flex;align-items:center;gap:8px;padding:8px 9px 8px 13px;border:1px solid var(--line);border-radius:28px;background:var(--card);box-shadow:var(--shadow)}.composer span{flex:1;color:var(--muted);font-size:15px}.circle{width:31px;height:31px;padding:0;border:0;border-radius:999px;background:var(--blue-soft);color:var(--blue-text);font-size:18px}.send{background:var(--blue);color:#fff}
/* dock：Palink 唯一允许真 blur 的既有处（dock 药丸），保留 */
.dock{position:absolute;left:13px;right:13px;bottom:13px;height:52px;z-index:5;display:grid;grid-template-columns:repeat(4,1fr);padding:4px;border:1px solid var(--line);border-radius:35px;background:var(--glass);backdrop-filter:blur(22px)}
.dock button{border:0;border-radius:999px;background:transparent;color:var(--muted);font-size:12px;font-family:inherit}.dock .active{background:var(--blue-soft);color:var(--text)}.overlay{position:absolute;inset:0;z-index:10;display:none}.overlay.show{display:flex}
/* 模态遮罩：中性冷色实底，无 blur */
.confirm{align-items:center;padding:16px;background:rgba(2,6,23,.45)}
.dialog{width:100%;padding:17px;border:1px solid var(--line);border-radius:16px;background:var(--card);box-shadow:0 20px 50px rgba(0,0,0,.16)}.dialog h2{margin:0;font-size:17px;font-family:'Sora','Manrope','PingFang SC',sans-serif}.dialog p{margin:7px 0 0;color:var(--muted);font-size:13px}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.actions button{padding:7px 14px;border:1px solid var(--line);border-radius:999px;background:transparent;color:var(--text);font-size:13px;font-family:inherit}.actions .primary{border-color:var(--blue);background:var(--blue);color:#fff}.page{flex-direction:column;align-items:center;justify-content:center;padding:30px;text-align:center;background:var(--chat)}.page .mark{width:54px;height:54px;color:var(--warn)}.page .mark svg{width:26px;height:26px;stroke-width:2}.page h2{margin:14px 0 0;font-size:19px;font-family:'Sora','Manrope','PingFang SC',sans-serif}.page p{max-width:240px;margin:7px 0 0;color:var(--muted);font-size:13px}.page button{width:220px;height:38px;margin-top:18px;border:0;border-radius:999px;background:var(--blue);color:#fff;font-size:14px;font-family:inherit}.page button+button{margin-top:8px;border:1px solid var(--line);background:transparent;color:var(--text)}
</style>
</head>
<body>
<main class="wrap"><div class="toolbar"><select id="stateSelect" aria-label="选择状态"><option value="error">生成失败</option><option value="network">网络断开</option><option value="timeout">请求超时</option><option value="model">模型不可用</option><option value="auth">登录已过期</option><option value="upload">上传失败</option><option value="success">保存成功</option><option value="copied">复制成功</option><option value="loading">加载中</option><option value="confirm">删除确认</option><option value="page">页面异常</option></select><button id="theme">深色</button></div>
<section class="phone"><div class="top"><div class="notch"></div><div class="status"><span>9:41</span><span>••• ▰</span></div><header class="head"><button aria-label="返回">‹</button><div class="avatar">A</div><div class="who"><b>Aurora</b><span>角色对话 · 在线</span></div><button aria-label="更多">···</button></header></div>
<div class="toast" id="toast"><i class="dot"></i><div><b id="toastTitle"></b><span id="toastSub"></span></div><button class="x" data-close aria-label="关闭"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></div>
<section class="messages"><div class="date">今天 09:41</div><div class="msg user">继续刚才的场景。<span class="time">09:40</span></div><div class="msg assistant">好，我会保持刚才的节奏继续写下去。<span class="time">09:40</span></div><div class="msg user">继续生成下一段。<span class="time">09:41</span></div>
<div class="state err show" data-state-view="error"><i class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg></i><div class="copy"><b>生成失败</b><span>连接超时，未生成回复</span></div><button>重试</button><button class="x" data-close aria-label="关闭"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></div>
<div class="state warn" data-state-view="network"><i class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><line x1="1" y1="1" x2="23" y2="23"/><path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"/><path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"/><path d="M10.71 5.05A16 16 0 0 1 22.58 9"/><path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"/><path d="M8.53 16.11a6 6 0 0 1 6.95 0"/><line x1="12" y1="20" x2="12.01" y2="20"/></svg></i><div class="copy"><b>网络已断开</b><span>恢复连接后会继续重试</span></div><button class="x" data-close aria-label="关闭"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></div>
<div class="state warn" data-state-view="timeout"><i class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg></i><div class="copy"><b>请求超时</b><span>这次没有生成回复</span></div><button>重试</button><button class="x" data-close aria-label="关闭"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></div>
<div class="state err" data-state-view="model"><i class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg></i><div class="copy"><b>模型暂不可用</b><span>请稍后重试或切换模型</span></div><button>切换</button><button class="x" data-close aria-label="关闭"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></div>
<div class="state warn" data-state-view="auth"><i class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"/></svg></i><div class="copy"><b>登录已过期</b><span>重新登录后继续</span></div><button>登录</button><button class="x" data-close aria-label="关闭"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></div>
<div class="state err" data-state-view="upload"><i class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg></i><div class="copy"><b>上传失败</b><span>文件未上传，请重新选择</span></div><button>重试</button><button class="x" data-close aria-label="关闭"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></div>
<div class="state ok" data-state-view="success"><i class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg></i><div class="copy"><b>已保存</b><span>更改已保存</span></div><button class="x" data-close aria-label="关闭"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></div>
<div class="state ok" data-state-view="copied"><i class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg></i><div class="copy"><b>已复制</b><span>内容已复制到剪贴板</span></div><button class="x" data-close aria-label="关闭"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></div>
<div class="state warn" data-state-view="loading"><i class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="2" x2="12" y2="6"/><line x1="12" y1="18" x2="12" y2="22"/><line x1="4.93" y1="4.93" x2="7.76" y2="7.76"/><line x1="16.24" y1="16.24" x2="19.07" y2="19.07"/><line x1="2" y1="12" x2="6" y2="12"/><line x1="18" y1="12" x2="22" y2="12"/><line x1="4.93" y1="19.07" x2="7.76" y2="16.24"/><line x1="16.24" y1="7.76" x2="19.07" y2="4.93"/></svg></i><div class="copy"><b>正在加载</b><span>请稍候</span></div><button class="x" data-close aria-label="关闭"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></div></section>
<div class="composer"><button class="circle">+</button><span>与 Aurora 对话…</span><button class="circle send">↑</button></div><nav class="dock"><button class="active">聊天</button><button>工作区</button><button>角色</button><button>设置</button></nav>
<div class="overlay confirm" id="confirm"><div class="dialog"><h2>删除这段对话？</h2><p>删除后无法恢复，相关消息也会从当前会话中移除。</p><div class="actions"><button data-close>取消</button><button class="primary" data-close>删除</button></div></div></div><div class="overlay page" id="page"><i class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg></i><h2>页面暂时无法显示</h2><p>刚才的内容已经保留。重新加载后可以继续这段对话。</p><button data-close>重新加载页面</button><button data-close>返回角色列表</button></div>
</section></main>
<script>
(function(){'use strict';var select=document.getElementById('stateSelect'),theme=document.getElementById('theme'),views=[].slice.call(document.querySelectorAll('[data-state-view]')),toast=document.getElementById('toast'),confirmBox=document.getElementById('confirm'),page=document.getElementById('page'),title=document.getElementById('toastTitle'),sub=document.getElementById('toastSub');var data={network:['网络已断开',' · 恢复连接后会继续重试','warn'],success:['已保存',' · 更改已保存','ok'],copied:['已复制',' · 内容已复制到剪贴板','ok'],loading:['正在加载',' · 请稍候','warn']};function reset(){views.forEach(function(v){v.classList.remove('show')});toast.className='toast';confirmBox.classList.remove('show');page.classList.remove('show')}function show(name){reset();if(name==='confirm'){confirmBox.classList.add('show');return}if(name==='page'){page.classList.add('show');return}if(data[name]){var d=data[name];title.textContent=d[0];sub.textContent=d[1];toast.className='toast show '+d[2];return}var view=document.querySelector('[data-state-view="'+name+'"]');if(view)view.classList.add('show')}select.addEventListener('change',function(){show(select.value)});document.addEventListener('click',function(e){if(e.target.closest('[data-close]')){reset();select.value='error';return}if(e.target===theme){var dark=document.documentElement.dataset.theme==='dark';document.documentElement.dataset.theme=dark?'light':'dark';theme.textContent=dark?'深色':'浅色'}});show('error')})()
</script>
</body>
</html>
